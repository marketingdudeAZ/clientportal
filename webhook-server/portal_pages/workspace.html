<style>
/* ── Tokens ────────────────────────────────────────────────────────────
   Structure, type scale, spacing and radii follow the v3 product design
   system. Every color is the RPM Living palette ("RPM Templates"):
   exact brand hexes for fills, rules, accents and charts; darker shades of
   the same hues for small text and button fills so every pair passes AA.
   Status colors are derived to sit with the palette (see the build plan). */
:root{
  --font-sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --text-fine:11px; --text-label:12px; --text-support:13px; --text-body:14px; --text-title:16px;
  --text-page:24px; --text-metric:32px; --text-metric-lg:44px;
  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-6:24px; --space-8:32px; --space-12:48px; --space-16:64px;
  --radius-sm:6px; --radius-md:8px; --radius-lg:12px; --radius-full:999px;

  /* Brand (exact) */
  --juniper:#444E4C; --black:#282D27; --gray:#76797A; --copper:#AB784A; --sage:#8BA395; --mint:#BDDDD9; --rule:#D9DEDC; --ink-on-dark:#E7EBE9;
  /* Brand shades for text and fills (same hues, darker for AA) */
  --copper-fill:#97693F; --copper-fill-hover:#86592F; --copper-ink:#8A6A3F; --gray-ink:#6F7372; --gray-ink-strong:#5E6261;
  /* Surfaces (tints of Ink-on-dark and Mint on white) */
  --color-bg:#FBFCFC; --color-card:#FFFFFF; --color-muted:#F3F5F4; --color-brand-soft:#E8F3F2;
  /* Roles */
  --color-fg:var(--black); --color-fg-2:var(--juniper); --color-fg-muted:var(--gray-ink);
  --color-border:var(--rule); --color-line:var(--ink-on-dark);
  --color-brand:var(--copper);
  /* Status: fill (dots, bars) · soft (backgrounds) · text (AA on white, bg and soft) */
  --healthy:#8BA395;   --healthy-soft:#ECF0EE;   --healthy-text:#5B7265;
  --attention:#C39A4B; --attention-soft:#F5EFE2; --attention-text:#86672D;
  --warning:#BF7B52;   --warning-soft:#F5EAE3;   --warning-text:#975C38;
  --critical:#B0544A;  --critical-soft:#F2E4E2;  --critical-text:#A34E45;
  --new:#76797A;       --new-soft:#E9EAEA;       --new-text:#676A6A;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none !important}
html,body{height:100%}
body{font-family:var(--font-sans);font-size:var(--text-body);line-height:22px;color:var(--color-fg);background:var(--color-bg);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;overflow-wrap:anywhere;font-feature-settings:"tnum"}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
ol,ul{list-style:none}
:focus-visible{outline:2px solid var(--copper-fill);outline-offset:2px;border-radius:4px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.skip{position:absolute;left:-999px;top:8px;z-index:60;background:var(--color-card);padding:8px 12px;border-radius:6px}
.skip:focus{left:8px}
.mono{font-family:var(--font-mono)}

/* ── Shell (App Shell EI-1) ─────────────────────────────────────────── */
.app{display:flex;min-height:100vh}
/* The column and its border run the full page height; the nav inside it stays in view. */
.side{width:240px;flex-shrink:0;background:var(--color-card);border-right:1px solid var(--color-border)}
.side-in{padding:12px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.logo{height:40px;display:flex;align-items:center;gap:10px;padding-inline:8px;margin-bottom:16px}
.logo b{font-weight:700;font-size:16px;line-height:20px;letter-spacing:.16em;color:var(--color-fg)}
.logo span{font-size:12px;line-height:16px;color:var(--color-fg-muted);letter-spacing:.04em}
.logo i{width:20px;height:20px;border-radius:5px;background:var(--copper);display:block;flex-shrink:0}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-label{padding:20px 10px 6px;font-size:11px;line-height:14px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--color-fg-muted)}
.nav a{height:36px;display:flex;align-items:center;gap:10px;padding-inline:10px;border-radius:var(--radius-sm);font-size:13px;line-height:16px;font-weight:500;color:var(--color-fg-muted);transition:background-color .15s,color .15s}
.nav a svg{width:16px;height:16px;flex-shrink:0;stroke:currentColor}
.nav a .t{flex:1}
.nav a .count{font-size:11px;line-height:14px;font-weight:500;color:var(--color-fg-muted)}
.nav a .badge{height:18px;min-width:18px;padding-inline:5px;border-radius:var(--radius-full);background:var(--copper-fill);color:#fff;font-size:11px;line-height:18px;font-weight:600;text-align:center}
@media (hover:hover){.nav a:not([aria-current="page"]):hover{background:var(--color-muted);color:var(--color-fg)}}
.nav a[aria-current="page"]{background:var(--juniper);color:var(--ink-on-dark);font-weight:600}
.nav a[aria-current="page"] .count{color:var(--ink-on-dark)}
.side-grow{flex:1;min-height:12px}
.loopcard{display:flex;align-items:center;gap:10px;background:var(--color-brand-soft);border-radius:var(--radius-sm);padding:10px;margin-bottom:12px}
.loopcard i{width:8px;height:8px;border-radius:50%;background:var(--sage);flex-shrink:0;position:relative}
@media (prefers-reduced-motion:no-preference){.loopcard i.on::after{content:"";position:absolute;inset:0;border-radius:50%;background:var(--sage);animation:ping 2s cubic-bezier(0,0,.2,1) infinite}}
@keyframes ping{75%,100%{transform:scale(2.4);opacity:0}}
.loopcard b{display:block;font-size:12px;line-height:16px;font-weight:600;color:var(--juniper)}
.loopcard span{display:block;font-size:11px;line-height:14px;color:var(--gray-ink-strong);white-space:nowrap}
.side-bottom{border-top:1px solid var(--color-border);padding-top:12px;display:flex;flex-direction:column;gap:6px}
.userrow{display:flex;align-items:center;gap:10px;min-height:44px;padding-inline:10px}
.avatar{width:24px;height:24px;border-radius:50%;background:var(--juniper);color:#fff;font-size:10px;line-height:12px;font-weight:600;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.userrow div b{display:block;font-size:12px;line-height:16px;font-weight:600}
.userrow div span{display:block;font-size:11px;line-height:14px;color:var(--color-fg-muted)}
.previewtoggle{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:36px;padding:6px 10px;border-radius:var(--radius-sm);font-size:12px;line-height:16px;font-weight:500;color:var(--color-fg-2);width:100%;text-align:left}
.previewtoggle:hover{background:var(--color-muted)}
.switch{width:28px;height:16px;border-radius:999px;background:var(--rule);position:relative;flex-shrink:0;transition:background-color .15s}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:#fff;transition:transform .15s}
.previewtoggle[aria-pressed="true"] .switch{background:var(--copper-fill)}
.previewtoggle[aria-pressed="true"] .switch::after{transform:translateX(12px)}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{height:48px;flex-shrink:0;display:flex;align-items:center;gap:12px;padding-inline:16px;background:var(--color-card);border-bottom:1px solid var(--color-border);position:sticky;top:0;z-index:20}
.crumbs{display:flex;align-items:center;gap:8px;font-size:13px;line-height:16px;min-width:0;white-space:nowrap}
.crumbs b{font-weight:600}
.crumbs .sep{color:var(--color-fg-muted)}
.crumbs .ctx{color:var(--color-fg-muted);overflow:hidden;text-overflow:ellipsis}
.top-grow{flex:1}
.search-wrap{position:relative}
.search{width:280px;height:30px;display:flex;align-items:center;gap:8px;padding-inline:10px;background:var(--color-bg);border:1px solid var(--color-border);border-radius:var(--radius-md)}
.search:focus-within{outline:2px solid var(--copper-fill);outline-offset:1px}
.search svg{flex-shrink:0}
.search input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:13px;line-height:16px}
.search input::placeholder{color:var(--color-fg-muted)}
.kbd{background:var(--color-muted);border:1px solid var(--color-border);border-radius:4px;padding:1px 5px;font-size:11px;line-height:14px;font-weight:500;color:var(--color-fg-muted)}
.sresults{position:absolute;left:0;top:calc(100% + 6px);width:380px;max-height:420px;overflow-y:auto;background:var(--color-card);border:1px solid var(--color-border);border-radius:var(--radius-md);box-shadow:0 8px 24px rgba(40,45,39,.12);z-index:30;padding:6px}
.sgrp + .sgrp{border-top:1px solid var(--color-line);margin-top:4px;padding-top:4px}
.sgl{font-size:11px;line-height:14px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--color-fg-muted);padding:8px 10px 4px}
.sopt{display:flex;flex-direction:column;justify-content:center;gap:2px;padding:8px 10px;border-radius:var(--radius-sm);cursor:pointer;min-height:44px}
.sopt b{font-size:13px;line-height:16px;font-weight:500}
.sopt span{font-size:12px;line-height:16px;color:var(--color-fg-muted)}
.sopt:hover,.sopt[aria-selected="true"]{background:var(--color-muted)}
.sopt[aria-selected="true"]{box-shadow:inset 3px 0 0 var(--copper)}
.sempty{padding:10px;font-size:13px;line-height:18px;color:var(--color-fg-muted)}
.previewbar{display:flex;align-items:center;gap:12px;padding:8px 24px;background:var(--attention-soft);border-bottom:1px solid var(--color-border);font-size:13px;line-height:18px;color:var(--attention-text)}
.previewbar b{font-weight:600}
.previewbar .grow{flex:1}

/* Content + right rail */
main.content{display:flex;flex:1;min-height:0;align-items:stretch}
.page{flex:1;min-width:0;display:flex;flex-direction:column;gap:24px;padding:28px 32px 48px}
.rail{width:340px;flex-shrink:0;background:var(--color-card);border-left:1px solid var(--color-border);padding:28px 24px;display:flex;flex-direction:column;gap:20px}
.page.narrow{max-width:1140px}

/* ── Type roles (Design System 7H-1) ─────────────────────────────────── */
.h-page{font-size:24px;line-height:30px;font-weight:700;letter-spacing:-.02em}
.h-greet{font-size:24px;line-height:30px;font-weight:500;letter-spacing:-.01em}
.h-card{font-size:16px;line-height:20px;font-weight:600}
.h-sec{font-size:16px;line-height:20px;font-weight:500}
.h-rail{font-size:14px;line-height:18px;font-weight:600}
.eyebrow{font-size:12px;line-height:16px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--color-fg-muted)}
.support{font-size:13px;line-height:20px;color:var(--color-fg-muted)}
.fine{font-size:11px;line-height:14px;color:var(--color-fg-muted)}
.metric{font-size:32px;line-height:40px;font-weight:700;letter-spacing:-.02em}
.back{font-size:13px;line-height:16px;font-weight:500;color:var(--copper-ink);display:inline-flex;align-items:center;gap:4px;min-height:24px}
.back:hover,.link:hover{text-decoration:underline}
.link{font-size:13px;line-height:16px;font-weight:500;color:var(--copper-ink)}
.link.quiet{color:var(--color-fg-muted);font-weight:400}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.head .stack{display:flex;flex-direction:column;gap:4px;min-width:0}
.asof{font-size:12px;line-height:16px;color:var(--color-fg-muted);white-space:nowrap}
.gaps{font-size:13px;line-height:20px;color:var(--color-fg-muted)}
.receipt{font-size:12px;line-height:16px;color:var(--color-fg-muted)}

/* ── Controls ────────────────────────────────────────────────────────── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:36px;padding-inline:16px;border-radius:var(--radius-sm);font-size:14px;line-height:18px;font-weight:500;border:1px solid var(--color-border);background:var(--color-card);color:var(--color-fg);white-space:nowrap;transition:background-color .15s}
.btn:hover{background:var(--color-muted)}
.btn.primary{background:var(--copper-fill);border-color:var(--copper-fill);color:#fff;font-weight:600}
.btn.primary:hover{background:var(--copper-fill-hover)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--color-fg-muted)}
.btn.sm{height:30px;padding-inline:12px;font-size:13px;line-height:16px}
.btn.xs{height:28px;padding-inline:12px;font-size:12px;line-height:16px}
.btn.outline{border-color:var(--copper-fill);color:var(--copper-ink);background:var(--color-card)}
.btn.outline:hover{background:var(--color-brand-soft)}
.btn.big{height:46px;padding-inline:28px;font-size:15px;line-height:18px;font-weight:600}
.btn[disabled]{opacity:.6;cursor:progress}
.textbtn{font-size:12px;line-height:16px;color:var(--color-fg-muted);min-height:28px;padding-inline:4px}
.textbtn:hover{color:var(--color-fg);text-decoration:underline}
.textbtn.danger{color:var(--critical-text)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{height:28px;padding-inline:12px;border-radius:var(--radius-full);border:1px solid var(--color-border);background:var(--color-card);font-size:13px;line-height:16px;color:var(--color-fg-muted)}
.chip:hover{background:var(--color-muted)}
.chip[aria-pressed="true"]{background:var(--juniper);border-color:var(--juniper);color:var(--ink-on-dark);font-weight:500}
.pill{display:inline-flex;align-items:center;gap:6px;height:22px;padding-inline:10px;border-radius:var(--radius-full);font-size:12px;line-height:16px;font-weight:500;white-space:nowrap}
.pill i{width:5px;height:5px;border-radius:50%;background:currentColor;flex-shrink:0}
.pill.healthy{background:var(--healthy-soft);color:var(--healthy-text)}
.pill.attention{background:var(--attention-soft);color:var(--attention-text)}
.pill.warning{background:var(--warning-soft);color:var(--warning-text)}
.pill.critical{background:var(--critical-soft);color:var(--critical-text)}
.pill.new{background:var(--new-soft);color:var(--new-text)}
.pill.brand{background:var(--color-brand-soft);color:var(--juniper)}
.pill.fh{background:var(--color-muted);color:var(--juniper);border:1px solid var(--color-border)}
.tag{display:inline-flex;align-items:center;height:20px;padding-inline:8px;border-radius:4px;font-size:11px;line-height:14px;font-weight:500;white-space:nowrap}
.tag.cost{background:var(--healthy-soft);color:var(--healthy-text)}
.tag.vendor,.tag.content{background:var(--color-brand-soft);color:var(--juniper)}
.tag.negotiate{background:var(--attention-soft);color:var(--attention-text)}
.tag.creative{background:var(--color-muted);color:var(--gray-ink-strong)}
.tag.compliance{background:var(--critical-soft);color:var(--critical-text)}
.tag.internal{background:var(--color-muted);color:var(--gray-ink-strong);gap:4px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex-shrink:0}
.dot.healthy{background:var(--healthy)} .dot.attention{background:var(--attention)} .dot.warning{background:var(--warning)} .dot.critical{background:var(--critical)} .dot.new{background:var(--new)} .dot.brand{background:var(--copper)}
.t-healthy{color:var(--healthy-text)} .t-attention{color:var(--attention-text)} .t-warning{color:var(--warning-text)} .t-critical{color:var(--critical-text)} .t-new{color:var(--new-text)} .t-brand{color:var(--copper-ink)}
.card{background:var(--color-card);border:1px solid var(--color-border);border-radius:var(--radius-md)}
.inline-err{font-size:13px;line-height:18px;color:var(--critical-text)}

/* KPI strip */
.kpis{display:flex;align-items:flex-start;border-bottom:1px solid var(--color-border);padding-bottom:20px;flex-wrap:wrap;row-gap:16px}
.kpi{display:flex;flex-direction:column;gap:4px;padding-inline:24px;border-left:1px solid var(--color-border);min-width:0}
.kpi:first-child{padding-left:0;border-left:0}
.kpi .eyebrow{letter-spacing:.04em}
.kpi .v{font-size:32px;line-height:40px;font-weight:700;letter-spacing:-.02em}
.kpi.sm .v{font-size:24px;line-height:30px}
.kpi .rc{font-size:11px;line-height:14px;color:var(--color-fg-muted)}
.kpi.emph .eyebrow{color:var(--color-fg-2);font-weight:600}
.kpiset{display:flex;flex-direction:column;gap:16px;border-bottom:1px solid var(--color-border);padding-bottom:20px}
.kpiset .kpis{display:grid;border-bottom:0;padding-bottom:0;row-gap:16px}
.kpis.row4,.kpis.row3{grid-template-columns:repeat(4,minmax(0,1fr))}
.kpis.row3{border-top:1px solid var(--color-line);padding-top:16px}

/* Tables (v3 pattern) */
.tscroll{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;padding:8px 12px 8px 0;border-bottom:1px solid var(--color-border);font-size:12px;line-height:16px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;color:var(--color-fg-muted);white-space:nowrap}
.tbl td{padding:10px 12px 10px 0;border-bottom:1px solid var(--color-line);font-size:13px;line-height:16px;vertical-align:middle}
.tbl td.name{font-size:14px;line-height:18px;font-weight:500}
.tbl .num{text-align:right}
.tbl tr.rowlink{cursor:pointer}
.tbl tr.rowlink:hover td{background:var(--color-muted)}
.tbl.boxed{border:1px solid var(--color-border);border-radius:var(--radius-md);border-collapse:separate;border-spacing:0;overflow:hidden;background:var(--color-card)}
.tbl.boxed th{background:var(--color-bg);padding:10px 16px;font-size:11px;line-height:14px;font-weight:600;letter-spacing:.05em}
.tbl.boxed td{padding:12px 16px}
.tbl.boxed tr:last-child td{border-bottom:0}
.tbl.boxed td:first-child,.tbl.boxed th{white-space:nowrap}
/* The page allows breaking long strings anywhere; tables keep whole words so column labels never split mid-word. */
.tbl{overflow-wrap:normal}
.tbl td.surface{white-space:nowrap}
.empty-dash{color:var(--color-fg-muted)}

/* States */
.state{padding:48px 32px;display:flex;flex-direction:column;gap:10px;max-width:560px}
.state h2{font-size:18px;line-height:24px;font-weight:600}
.state p{font-size:14px;line-height:21px;color:var(--color-fg-muted)}
.loading{display:flex;align-items:center;gap:10px;color:var(--color-fg-muted);font-size:13px}
.spinner{width:14px;height:14px;border:2px solid var(--color-line);border-top-color:var(--copper);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spinner{animation:none}}
.gate{position:fixed;inset:0;background:var(--juniper);z-index:2147483000;display:flex;align-items:center;justify-content:center;padding:16px}
@media (prefers-reduced-motion:no-preference){.page{animation:rise .3s ease-out}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
/* ── Dashboard (CXR-2, FYF-1 hero) ───────────────────────────────────── */
.greet{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.greet .stack{display:flex;flex-direction:column;gap:2px}
.hero{display:flex;align-items:center;gap:32px;background:var(--attention-soft);border:1px solid var(--rule);border-radius:var(--radius-sm);padding:22px 24px 22px 28px}
.hero .l{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.hero .q{font-size:20px;line-height:28px;font-weight:600;letter-spacing:-.01em}
.hero .body{font-size:14px;line-height:22px;color:var(--color-fg-2)}
.hero .r{width:220px;flex-shrink:0;display:flex;flex-direction:column;gap:8px}
.hero .r .btn{width:100%;height:40px}
.hero .r .link{align-self:flex-start;padding-top:2px}
.sec{display:flex;flex-direction:column;gap:10px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.tiles{display:flex;flex-wrap:wrap;gap:6px}
.tile{width:104px;min-height:62px;padding:8px 10px;border-radius:4px;display:flex;flex-direction:column;gap:2px;text-align:left}
.tile span{font-size:11px;line-height:14px;color:var(--color-fg-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile b{font-size:18px;line-height:22px;font-weight:700}
.tile.healthy{background:var(--healthy-soft)} .tile.healthy b{color:var(--healthy-text)}
.tile.attention{background:var(--attention-soft)} .tile.attention b{color:var(--attention-text)}
.tile.warning{background:var(--warning-soft)} .tile.warning b{color:var(--warning-text)}
.tile.critical{background:var(--critical-soft)} .tile.critical b{color:var(--critical-text)}

.healthcell{display:inline-flex;align-items:center;gap:6px;font-weight:500}
.feed{display:flex;flex-direction:column;gap:10px}
.feed li{display:flex;gap:8px;align-items:flex-start}

.feed li b{display:block;font-size:13px;line-height:18px;font-weight:400}
.feed li div>span{display:block;font-size:11px;line-height:14px;color:var(--color-fg-muted)}
.feed li .tag{margin-left:6px;vertical-align:middle}
.rail-sep{border-top:1px solid var(--color-border)}
.wcard{border:1px solid var(--color-border);border-radius:var(--radius-sm);padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.wcard .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.wcard .top b{font-size:13px;line-height:16px;font-weight:500}
.wcard p{font-size:12px;line-height:16px;color:var(--color-fg-muted)}
.wcard .acts{display:flex;align-items:center;gap:8px}
.countbadge{display:inline-flex;align-items:center;justify-content:center;height:18px;min-width:18px;padding-inline:6px;border-radius:999px;background:var(--copper-fill);color:#fff;font-size:11px;line-height:14px;font-weight:600;margin-left:6px}

/* ── Approvals (DDE-0, 1HM-0) ───────────────────────────────────────── */
.meta-line{font-size:14px;line-height:18px;color:var(--color-fg-muted)}
.meta-line .warn{color:var(--attention-text);font-weight:500}
.interrupts{display:flex;flex-direction:column;gap:8px}
.intr{display:flex;align-items:flex-start;gap:12px;background:var(--color-card);border:1px solid var(--color-line);border-left:2px solid var(--attention);border-radius:0 var(--radius-sm) var(--radius-sm) 0;padding:14px 16px}

.intr .l{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.intr .l b{font-size:14px;line-height:18px;font-weight:600;color:var(--attention-text)}
.intr.compliance .l b{color:var(--critical-text)}
.intr .l p{font-size:13px;line-height:18px;color:var(--color-fg-muted)}
.intr .r{display:flex;align-items:center;gap:8px;flex-shrink:0}
.intr .btn{border-color:var(--attention);color:var(--attention-text)}
.intr.compliance .btn{border-color:var(--critical);color:var(--critical-text)}
.batch td.acts{white-space:nowrap;text-align:right}
.batch td.acts .btn{margin-right:6px}
.batch td.sav{font-weight:500;color:var(--healthy-text)}
.reasonrow td{background:var(--color-bg);padding:12px 16px}
.reasons{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.reasons .q{font-size:13px;line-height:16px;font-weight:600;margin-right:4px}
.rchip{height:30px;padding-inline:12px;border-radius:16px;border:1px solid var(--color-border);background:var(--color-card);font-size:13px;line-height:16px;color:var(--color-fg-2)}
.rchip:hover{background:var(--color-muted)}
.rchip[aria-pressed="true"]{background:var(--color-brand-soft);border-color:var(--mint);color:var(--juniper);font-weight:500}
.statline{font-size:13px;line-height:18px;color:var(--color-fg-muted)}
.emptybox{border:1.5px dashed var(--color-border);border-radius:var(--radius-lg);min-height:420px;padding:64px 40px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center}
.emptybox .ic{width:48px;height:48px;border-radius:50%;background:var(--healthy-soft);display:flex;align-items:center;justify-content:center}
.emptybox b{font-size:14px;line-height:18px;font-weight:600}
.done-row{font-size:13px;line-height:16px;color:var(--healthy-text);font-weight:500}

/* ── Item detail (existing screen, G4K-1 panel) ─────────────────────── */
.stage{display:flex;flex-direction:column;align-items:center;padding:32px 32px 56px;gap:20px}
.panel{width:100%;max-width:760px;background:var(--color-card);border:1px solid var(--color-border);border-radius:var(--radius-sm);padding:32px 36px;display:flex;flex-direction:column;gap:24px}
.panel-head{display:flex;flex-direction:column;gap:10px}
.panel-head .pills{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.qtitle{font-size:26px;line-height:34px;font-weight:600;letter-spacing:-.02em}
.why{display:flex;flex-direction:column;gap:14px}
.why .row{display:flex;gap:18px;align-items:flex-start}
.why .k{width:100px;flex-shrink:0;border:1px solid var(--color-border);border-radius:4px;padding:4px 8px;text-align:center;font-size:11px;line-height:14px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;color:var(--color-fg-muted)}
.why .v{flex:1;min-width:0;font-size:14px;line-height:24px;color:var(--color-fg-2)}
.why .rc{display:block;font-size:12px;line-height:18px;color:var(--color-fg-muted)}
.compare{background:var(--color-muted);border:1px solid var(--color-border);border-radius:var(--radius-sm);padding:8px 20px}
.compare table{width:100%;border-collapse:collapse}
.compare th{text-align:left;font-size:11px;line-height:14px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--gray-ink-strong);padding:10px 8px 6px 0}
.compare td{padding:8px 8px 8px 0;font-size:14px;line-height:18px;border-top:1px solid var(--color-border)}

.compare td .bar{display:inline-block;height:5px;border-radius:3px;background:var(--copper);vertical-align:middle;margin-right:8px}
.compare td .bar.max{background:var(--critical)}
.compare .more{font-size:12px;line-height:16px;color:var(--gray-ink-strong);padding:8px 0}
.spark{display:flex;align-items:flex-end;gap:7px;height:78px}
.spark .col{width:20px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:3px;height:72px}
.spark .col i{display:block;width:100%;border-radius:2px;background:var(--rule)}
.spark .col.hi i{background:var(--copper)}
.spark .col b{font-size:11px;line-height:14px;font-weight:600;color:var(--copper-ink)}
.spark .lbl{align-self:flex-end;padding-left:10px;font-size:12px;line-height:16px;color:var(--color-fg-muted)}
.steps li{display:flex;gap:14px;padding:12px 0;border-top:1px solid var(--color-line);align-items:flex-start}
.steps li:first-child{border-top-color:var(--color-border)}
.steps .d{width:86px;flex-shrink:0;font-size:13px;line-height:18px;font-weight:600}
.steps .l{flex:1;min-width:0;font-size:14px;line-height:21px;color:var(--color-fg-2)}
.steps .c{width:100px;flex-shrink:0;text-align:right;font-size:12px;line-height:16px;font-weight:500;color:var(--color-fg-muted)}
.actions-row{display:flex;align-items:center;gap:14px;border-top:1px solid var(--color-border);padding-top:24px;flex-wrap:wrap}
.actions-row .grow{flex:1}
.reasonbox{display:flex;flex-direction:column;gap:10px;background:var(--color-bg);border:1px solid var(--color-border);border-radius:var(--radius-sm);padding:14px 16px}
.reasonbox .hint{font-size:12px;line-height:16px;color:var(--color-fg-muted)}
.trail li{display:flex;gap:10px;align-items:baseline;padding:4px 0}
.trail .d{width:56px;flex-shrink:0;font-size:12px;line-height:16px;font-weight:500;color:var(--color-fg-muted)}
.trail .x{flex:1;min-width:0;font-size:13px;line-height:19px;color:var(--color-fg-2)}
.trail .who{color:var(--color-fg-muted)}
.afternote{font-size:13px;line-height:16px;color:var(--color-fg-muted)}

/* ── Review panel (Round 4): side drawer on desktop, full screen on mobile ─ */
body.drawer-open{overflow:hidden}
.drawer-scrim{position:fixed;inset:0;background:rgba(40,45,39,.32);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(580px,100%);background:var(--color-card);border-left:1px solid var(--color-border);box-shadow:-12px 0 32px rgba(40,45,39,.14);z-index:41;display:flex;flex-direction:column}
.drawer-head{display:flex;align-items:center;gap:12px;padding:10px 16px 10px 24px;border-bottom:1px solid var(--color-border);min-height:56px}
.drawer-head .grow{flex:1}
.iconbtn{width:44px;height:44px;border-radius:var(--radius-sm);display:inline-flex;align-items:center;justify-content:center;color:var(--color-fg-muted)}
.iconbtn:hover{background:var(--color-muted);color:var(--color-fg)}
.drawer-body{flex:1;overflow-y:auto;padding:24px;display:flex;flex-direction:column;gap:24px}
.rv-foot{display:flex;flex-direction:column;gap:12px}
.drawer .rv-foot{border-top:1px solid var(--color-border);padding:16px 24px;background:var(--color-card)}
.panel .rv-foot{border-top:1px solid var(--color-border);padding-top:20px}
.foot-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.foot-row .grow{flex:1}
.rv-title{font-size:20px;line-height:28px;font-weight:600;letter-spacing:-.01em}
.panel .rv-title{font-size:26px;line-height:34px;letter-spacing:-.02em}
.rv-sec{display:flex;flex-direction:column;gap:8px}
.rv-sec>h3{font-size:12px;line-height:16px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--color-fg-muted)}
.rv-sec>p{font-size:14px;line-height:22px;color:var(--color-fg-2)}
.rv-pills{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.rv-receipts{display:flex;flex-direction:column;gap:2px}
.rv-receipts li{font-size:12px;line-height:18px;color:var(--color-fg-muted)}
.rv-qs{display:flex;flex-wrap:wrap;gap:6px}
.rv-qs li{font-size:13px;line-height:18px;background:var(--color-muted);border-radius:var(--radius-sm);padding:4px 10px;color:var(--color-fg-2)}
.rv-does li{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--color-line)}

.rv-does .n{width:22px;height:22px;border-radius:50%;background:var(--color-brand-soft);color:var(--juniper);font-size:12px;line-height:22px;font-weight:600;text-align:center;flex-shrink:0}
.rv-does .l{flex:1;min-width:0;font-size:14px;line-height:20px}
.rv-does .m{display:block;font-size:12px;line-height:16px;color:var(--color-fg-muted);margin-top:2px}
.rv-draft{border:1px solid var(--color-border);border-radius:var(--radius-md);background:var(--color-bg);padding:16px}

.rv-draft .body{font-size:14px;line-height:22px;white-space:pre-wrap;color:var(--color-fg)}
.fh-meta{font-size:13px;line-height:18px;color:var(--color-fg-muted)}
.fh-finds{display:flex;flex-direction:column;gap:12px}
.fh-find{border:1px solid var(--color-border);border-left:3px solid var(--critical);border-radius:var(--radius-sm);padding:12px 14px;display:flex;flex-direction:column;gap:8px}

.fh-find.new{border-left-color:var(--gray)}
.fh-find .top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.fh-find .top b{font-size:13px;line-height:18px;font-weight:600;flex:1;min-width:0}
.fh-find blockquote{font-size:14px;line-height:21px;color:var(--color-fg);background:var(--color-muted);border-radius:4px;padding:6px 10px}
.fh-find p{font-size:13px;line-height:20px;color:var(--color-fg-2)}
.fh-find .k{display:block;font-size:12px;line-height:16px;font-weight:600;color:var(--gray-ink-strong)}
button.link{text-align:left;align-self:flex-start;min-height:24px}
.btn.wide{width:100%}

/* ── Approved ───────────────────────────────────────────────────────── */
.banner{display:flex;align-items:center;gap:14px;padding:18px 32px;background:var(--healthy-soft);border-bottom:1px solid var(--color-border)}
.banner .bcheck{width:30px;height:30px;border-radius:50%;background:var(--healthy-text);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.banner .btxt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.banner .btxt b{font-size:15px;line-height:18px;font-weight:600}
.banner .btxt span{font-size:13px;line-height:16px;color:var(--color-fg-2)}
.banner.undone{background:var(--color-muted)}
.undo-wrap{display:flex;align-items:center;gap:10px;flex-shrink:0}
.undo-note{font-size:13px;line-height:16px;color:var(--healthy-text);max-width:360px;text-align:right}
.motions li{display:flex;gap:18px;padding:18px 0;border-top:1px solid var(--color-line);align-items:flex-start}
.motions li:first-child{border-top-color:var(--color-border)}
.motions .mi{width:26px;flex-shrink:0;padding-top:1px}
.motions .mb{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.motions .mb b{font-size:16px;line-height:20px;font-weight:600}
.motions .mb p{font-size:14px;line-height:21px;color:var(--color-fg-2)}
.motions .ms{width:200px;flex-shrink:0;text-align:right;display:flex;flex-direction:column;gap:3px}
.motions .ms b{font-size:13px;line-height:16px;font-weight:600}
.motions .ms span{font-size:12px;line-height:16px;color:var(--color-fg-muted)}
.panes{display:flex;gap:16px;align-items:stretch}
.pane{background:var(--color-muted);border-radius:var(--radius-md);padding:18px 20px;display:flex;flex-direction:column;gap:9px}
.pane.grow{flex:1;min-width:0}
.pane.aside{width:360px;flex-shrink:0}

.record{display:flex;align-items:center;gap:9px}
.record .track{flex:1;height:6px;border-radius:3px;background:var(--rule)}
.record .fill{height:6px;border-radius:3px;background:var(--sage)}

/* ── Properties (GOO-0) and Property detail (D4I-2, G73-1) ──────────── */
.proptitle{display:flex;align-items:center;gap:16px}
.ring{position:relative;width:56px;height:56px;flex-shrink:0}
.ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:18px;line-height:22px;font-weight:700}
.forecast{display:flex;align-items:flex-end;gap:4px;height:150px}

.vrows li{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--color-line);font-size:13px;line-height:16px}

.vrows .n{width:220px;flex-shrink:0;font-weight:500}
.vrows .p{width:120px;flex-shrink:0}
.vrows .verdict{color:var(--color-fg-muted)}
.estats{display:flex;flex-wrap:wrap;row-gap:12px}

.scoped-links{display:flex;flex-wrap:wrap;gap:8px}
.loopcard2{padding:24px 28px 28px;display:flex;flex-direction:column}

.loopcard2 .lh b{flex:1;font-size:16px;line-height:20px;font-weight:600}
.stagel li{display:flex;gap:16px}
.stagel .rl{width:18px;flex-shrink:0;display:flex;flex-direction:column;align-items:center}
.stagel .node{width:10px;height:10px;border-radius:50%;background:var(--healthy);margin-top:5px;flex-shrink:0}
.stagel .node.waiting{width:12px;height:12px;background:var(--attention);box-shadow:0 0 0 3px var(--attention-soft)}
.stagel .node.upcoming{background:var(--color-card);border:1.5px solid var(--color-border)}
.stagel .conn{width:1px;flex:1;background:var(--color-border);margin-top:4px}
.stagel li:last-child .conn{display:none}
.stagel .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;padding-bottom:20px}
.stagel li:last-child .body{padding-bottom:0}
.stagel .tl{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.stagel .tl b{font-size:14px;line-height:18px;font-weight:600}
.stagel .tl span{font-size:12px;line-height:16px;color:var(--color-fg-muted)}
.stagel .tl span.wait{color:var(--attention-text);font-weight:500}
.stagel p{font-size:13px;line-height:21px;color:var(--color-fg-muted)}
.stagel li.upcoming .tl b{color:var(--color-fg-muted)}
.stagel .body .btn{align-self:flex-start;margin-top:4px}
.finding{background:var(--color-muted);border-radius:var(--radius-sm);padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.finding p{font-size:13px;line-height:20px}
.emailcard{border:1px solid var(--color-border);border-radius:var(--radius-sm);padding:12px;display:flex;flex-direction:column;gap:6px}
.emailcard b{font-size:13px;line-height:16px;font-weight:500}
.emailcard p{font-size:12px;line-height:18px;color:var(--color-fg-muted)}

/* ── Media plan (DM0-1, GJQ-1) ──────────────────────────────────────── */
.flight{padding:20px;display:flex;flex-direction:column;gap:10px;overflow-x:auto}
.frow{display:flex;align-items:center;min-width:820px}
.frow .fl{width:200px;flex-shrink:0;padding-right:12px;font-size:12px;line-height:16px;font-weight:500;color:var(--color-fg-muted)}

.flgrp b{font-size:11px;line-height:14px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--juniper)}
.flgrp span{font-size:12px;line-height:16px;color:var(--color-fg-muted)}
.frow.ch.flat .on{background:var(--color-muted);color:var(--gray-ink-strong)}
.tbl.boxed tr.grprow th{background:var(--color-muted);color:var(--juniper);font-size:12px;line-height:16px;letter-spacing:0;text-transform:none}
.tbl.boxed tr.grprow th .fine{color:var(--gray-ink-strong)}
.frow .cells{flex:1;display:grid;grid-template-columns:repeat(12,1fr)}
.frow .cells>*{text-align:center;font-size:11px;line-height:14px;padding:5px 2px}
.frow.mh .cells>*{font-weight:600;color:var(--color-fg-muted)}
.frow.mh .cells>.peak{background:var(--color-brand-soft);color:var(--juniper)}
.frow.bars{align-items:flex-end}
.frow.bars .cells>*{height:64px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:2px;padding:0}
.frow.bars i{display:block;width:80%;border-radius:2px}
.frow.bars span{font-size:10px;line-height:12px;color:var(--color-fg-muted)}
.frow.ch{border-top:1px solid var(--color-line)}
.frow.ch .on{background:var(--color-brand-soft);color:var(--juniper)}
.frow.ch .off{color:var(--color-fg-muted)}
.frow.tot{border-top:1px solid var(--color-border)}
.frow.tot .fl,.frow.tot .cells>*{font-weight:700;color:var(--color-fg)}
.allocated{align-self:flex-end;font-size:13px;line-height:16px;font-weight:600;color:var(--healthy-text)}
.notes li{display:flex;gap:8px;font-size:13px;line-height:20px}
.notes li::before{content:"";width:3px;border-radius:2px;background:var(--copper);flex-shrink:0}
.notes{display:flex;flex-direction:column;gap:12px}

/* ── Visibility (E06-1) ─────────────────────────────────────────────── */
.vhero{display:flex;align-items:center;gap:20px}
.vhero .big{font-size:48px;line-height:56px;font-weight:700}
.engines{display:flex;overflow:hidden}
.engines .cell{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:4px;padding:16px 8px;border-right:1px solid var(--color-border)}
.engines .cell:last-child{border-right:0}
.engines .cell span{font-size:12px;line-height:16px;font-weight:500;color:var(--color-fg-muted)}
.engines .cell b{font-size:24px;line-height:30px;font-weight:700}
.engines .cell em{font-style:normal;font-size:11px;line-height:14px;color:var(--color-fg-muted)}
.tbl .self{background:var(--color-brand-soft);font-weight:600}
.citebar{display:flex;height:24px;border-radius:4px;overflow:hidden}
.citebar i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;line-height:16px;color:var(--color-fg-2)}

<script>
(function () {
  'use strict';

  /* ── Identity ────────────────────────────────────────────────────────
     Never an email in the URL. Two ways in:
     1. A signed preview link (?t=). It moves to sessionStorage, leaves the
        address bar, and rides on every API call as X-Workspace-Link. Links
        are read-only: writes need a Clerk session (/me says can_decide).
     2. Clerk, as in client-portal.html: calls wait for the session, then
        carry Authorization: Bearer <session JWT>. */
  var LINK_KEY = 'ws.link', PREVIEW_KEY = 'ws.preview', COMPANY_KEY = 'ws.company';
  var linkToken = null;
  try {
    var qs = new URLSearchParams(window.location.search);
    var tok = qs.get('t');
    if (tok) {
      sessionStorage.setItem(LINK_KEY, tok);
      qs.delete('t');
      var rest = qs.toString();
      history.replaceState(null, '', window.location.pathname + (rest ? '?' + rest : '') + window.location.hash);

    linkToken = sessionStorage.getItem(LINK_KEY);
  } catch (e) { linkToken = null; }

  var clerkReadyResolve, clerkReady = new Promise(function (res) { clerkReadyResolve = res; });
  if (!useClerk) clerkReadyResolve(false);

  function loadClerk() {
    var key = CLERK_PK.split('_').pop(), domain = '';
    try { domain = atob(key + '='.repeat((4 - key.length % 4) % 4)).replace(/\$$/, ''); } catch (e) {}
    var s = document.createElement('script');
    s.src = domain ? 'https://' + domain + '/npm/@clerk/clerk-js@5/dist/clerk.browser.js' : 'https://cdn.jsdelivr.net/npm/@clerk/clerk-js@5/dist/clerk.browser.js';
    s.async = true; s.crossOrigin = 'anonymous';
    s.setAttribute('data-clerk-publishable-key', CLERK_PK);
    s.onerror = function () { showSignIn('We could not reach the sign-in service. Check your connection and reload.'); };
    document.head.appendChild(s);
    var tries = 0;
    var timer = setInterval(function () {
      tries++;
      var C = window.Clerk, boot = null;
      if (C && typeof C.load === 'function') boot = function () { return C.load({ publishableKey: CLERK_PK }).then(function () { return C; }); };
      else if (C && typeof C === 'function') boot = function () { var inst = new C(CLERK_PK); window.Clerk = inst; return inst.load().then(function () { return inst; }); };

        clearInterval(timer);
        boot().then(function (inst) {
          if (inst.user) { clerkReadyResolve(true); return; }
          var d = document.createElement('div'); d.className = 'gate'; d.id = 'clerk-gate';

    }, 150);

  /* ── API ─────────────────────────────────────────────────────────────
     Same-origin only. While an internal user previews as a client, reads
     carry X-Workspace-Preview-Role: client (see the build plan). Writes never do. */
  function ApiError(status, body) {
    this.status = status; this.body = body;
    this.message = (body && (body.detail || body.reason || body.error)) || ('Request failed (' + status + ')');

    if (body && body.error === 'preview_read_only') this.message = 'Previewing as a client is read-only';
    if (body && body.error === 'not_undoable' && body.reason) this.message = body.reason;
  }
  function api(path, opts) {
    opts = opts || {};
    if (path.charAt(0) !== '/' || path.indexOf('//') === 0) throw new Error('same-origin paths only');

    return clerkReady.then(function (signedIn) {

      if (linkToken) h['X-Workspace-Link'] = linkToken;
      if (method === 'GET' && state.preview && path.indexOf('/api/workspace/me') !== 0) h['X-Workspace-Preview-Role'] = 'client';
      if (!signedIn || !window.Clerk || !window.Clerk.session) return h;
      return window.Clerk.session.getToken().then(function (t) { if (t) h['Authorization'] = 'Bearer ' + t; return h; });
    }).then(function (h) {
      var init = { method: method, headers: h, credentials: 'same-origin' };
      if (opts.body !== undefined) { h['Content-Type'] = 'application/json'; init.body = JSON.stringify(opts.body); }

      return res.text().then(function (txt) {
        var body = null;
        try { body = txt ? JSON.parse(txt) : null; } catch (e) { body = null; }

          throw new ApiError(401, body);
        }
        if (!res.ok) throw new ApiError(res.status, body);
        return { status: res.status, data: body };
      });

        var st = REQ_STATUS[x.status] || [String(x.status || ''), 'new'];
        var title = x.work_item_id ? '<a href="#/item/' + encodeURIComponent(x.work_item_id) + '">' + esc(x.title) + '</a>' : esc(x.title);
        return '<li><span class="rt">' + title + '</span><span class="rs"><i class="' + st[1] + '" aria-hidden="true"></i>' + esc(st[0] + (x.status === 'done' && x.status_date ? ' ' + shortDay(x.status_date) : '')) + '</span></li>';
      }).join('') : '<li class="support">Nothing sent yet.</li>';
    }).catch(function (e) { if (e && e.status === 401) return; box.innerHTML = '<li class="support">Your recent requests didn’t load.</li>'; });
  }
  function ticketCard(t) {
    var id = esc(t.draft_id);
    return '<article class="tcard" data-ticket="' + id + '"><div class="ttop"><label class="sr-only" for="tt-' + id + '">Ticket title</label><input class="ttitle" id="tt-' + id + '" data-f="title" value="' + esc(t.title) + '">' +
      '<label class="sr-only" for="tc-' + id + '">Category</label><select class="tcat" id="tc-' + id + '" data-f="category">' + CATEGORIES.map(function (c) { return '<option value="' + c + '"' + (c === t.category ? ' selected' : '') + '>' + c.toUpperCase() + '</option>'; }).join('') + '</select></div>' +
      '<dl class="tfields"><div><dt>Needed by</dt><dd class="need"><input type="date" data-f="needed_by" value="' + esc(t.needed_by || '') + '" aria-label="Needed by">' + (has(t.needed_by_reason) ? '<span>— ' + esc(t.needed_by_reason) + '</span>' : '') + '</dd></div>' +
      (has(t.team) ? '<div><dt>Goes to</dt><dd>' + esc(t.team) + '</dd></div>' : '') + (has(t.attached_context) ? '<div><dt>Attached</dt><dd>' + esc(t.attached_context.join(', ')) + '</dd></div>' : '') + '</dl>' +
      (t.failed ? '<p class="inline-err">Didn’t file: ' + esc(t.failed) + '</p>' : '') +
      (t.warnings || []).map(function (w) { return '<div class="twarn">' + esc(w) + '</div>'; }).join('') +
      '<div class="tact"><button type="button" class="textbtn" data-remove="' + id + '">Remove</button></div></article>';
  }
  function requestHtml(st) {
    var n = st.tickets.length, teams = [];
    st.tickets.forEach(function (t) { if (t.team && teams.indexOf(t.team) === -1) teams.push(t.team); });
    var action = !n ? '<button type="button" class="btn primary send" data-draft>Draft it</button>'
      : (canDecide() ? '<button type="button" class="btn primary send" data-send>Send it</button>' : '<p class="signin-row">' + signInLink('Sign in to send') + '</p>');
    var heard = n ? (n === 1 ? 'One request.' : word(n) + ' requests, filed separately.') + ' Fix anything that’s wrong before you send.'
      : (st.sent ? 'Sent. Status comes back under Your recent requests and in Approvals.' : 'Write it on the left and press Draft it. Each thing you ask for becomes its own ticket here.');
    var sent = st.sent ? (st.sent.created || []).map(function (c) {
      var t = (st.sent.tickets || []).filter(function (x) { return x.draft_id === c.draft_id; })[0] || {};
      return '<div class="tcard"><div class="ttop"><b>' + esc(t.title || 'Request') + '</b><span class="pill healthy"><i></i>Filed</span></div>' + (c.work_item_id ? '<a class="link" href="#/item/' + encodeURIComponent(c.work_item_id) + '">Follow it</a>' : '') + '</div>';
    }).join('') : '';
    var foot = n ? (n === 1 ? 'It lands' : (n === 2 ? 'Both land' : 'All ' + word(n, true) + ' land')) + ' in ClickUp with every field filled in. You never open it — status comes back here.' : '';
    return '<div class="req"><section class="req-l" aria-labelledby="req-h"><div class="stack" style="display:flex;flex-direction:column;gap:6px"><h1 class="req-h" id="req-h">What do you need?</h1><p class="req-sub">Write it how you’d say it. No form, no dropdowns, no ClickUp.</p></div>' +
      '<label class="req-box"><span class="sr-only">Describe what you need</span><textarea data-req-text rows="6" placeholder="For example: the A1 photos are from before the renovation. Can we reshoot before the October wave?">' + esc(st.text) + '</textarea></label>' +
      '<div class="req-row">' + (n ? '<button type="button" class="link" data-draft>Draft again</button>' : '') + '<span class="grow"></span><span class="support">' + esc(teams.length ? 'Goes to ' + teams.join(' and ') + ', not to your AM’s inbox' : 'Goes to the team that does the work, not to your AM’s inbox') + '</span></div>' +
      '<p class="inline-err" role="alert" hidden data-req-err></p>' +
      '<section class="req-recent"><h2 class="eyebrow">Your recent requests</h2><ul class="recent" data-recent><li class="support">Loading…</li></ul></section>' + action + '</section>' +
      '<section class="req-r" aria-labelledby="heard-h"><div class="stack" style="display:flex;flex-direction:column;gap:5px"><h2 class="eyebrow" id="heard-h" tabindex="-1">What we heard</h2><p class="req-sub">' + esc(heard) + '</p></div>' +
      sent + st.tickets.map(ticketCard).join('') + gapsLine(st.gaps) + '<div class="spacer"></div>' + (foot ? '<p class="req-foot">' + esc(foot) + '</p>' : '') + '</section></div>';
  }
  function readTickets() {
    var st = state.req; if (!st) return;
    view.querySelectorAll('.tcard[data-ticket]').forEach(function (card) {
      var t = st.tickets.filter(function (x) { return String(x.draft_id) === card.getAttribute('data-ticket'); })[0];
      if (t) card.querySelectorAll('[data-f]').forEach(function (el) { t[el.getAttribute('data-f')] = el.value || null; });
    });
  }
  function bindRequest() {
    var st = state.req, ta = view.querySelector('[data-req-text]'), err = view.querySelector('[data-req-err]');
    function fail(e, what) { if (e && e.status === 401) return; err.hidden = false; err.textContent = failText(e, what); }
    ta.addEventListener('input', function () { st.text = ta.value; });
    view.querySelectorAll('.tcard [data-f]').forEach(function (el) { el.addEventListener('input', readTickets); el.addEventListener('change', readTickets); });
    view.querySelectorAll('[data-remove]').forEach(function (b) { b.addEventListener('click', function () { readTickets(); var id = b.getAttribute('data-remove'); st.tickets = st.tickets.filter(function (t) { return String(t.draft_id) !== id; }); renderRequest('#heard-h'); }); });
    view.querySelectorAll('[data-draft]').forEach(function (b) {
      b.addEventListener('click', function () {
        if (!st.text.trim()) { err.hidden = false; err.textContent = 'Write what you need first.'; ta.focus(); return; }
        var label = b.textContent; b.disabled = true; b.textContent = 'Reading…';
        api('/api/workspace/requests/draft', { method: 'POST', body: { company_id: state.companyId, text: st.text } }).then(function (r) {
          var d = r.data || {}; st.tickets = d.tickets || []; st.gaps = d.gaps || []; st.sent = null; renderRequest('#heard-h');
        }).catch(function (e) { b.disabled = false; b.textContent = label; fail(e, 'We couldn’t draft that'); });
      });
    });
    var send = view.querySelector('[data-send]');
    if (send) send.addEventListener('click', function () {
      readTickets();
      if (st.tickets.some(function (t) { return !String(t.title || '').trim(); })) { err.hidden = false; err.textContent = 'Every ticket needs a title.'; return; }
      send.disabled = true; send.textContent = 'Sending…';
      var outgoing = st.tickets.map(function (t) { var c = {}; for (var k in t) if (k !== 'failed') c[k] = t[k]; return c; });
      api('/api/workspace/requests', { method: 'POST', body: { company_id: state.companyId, tickets: outgoing } }).then(function (r) {
        var d = r.data || {}, failed = {};
        (d.failed || []).forEach(function (f) { failed[f.draft_id] = f.reason || 'not filed'; });
        st.sent = { created: d.created || [], tickets: outgoing };
        st.tickets = outgoing.filter(function (t) { return failed[t.draft_id]; }).map(function (t) { t.failed = failed[t.draft_id]; return t; });
        if (!st.tickets.length) st.text = '';
        renderRequest('#heard-h');
      }).catch(function (e) { send.disabled = false; send.textContent = 'Send it'; fail(e, 'That didn’t send'); });
    });
  }



  /* ── Router ──────────────────────────────────────────────────────── */
  function route() {
    stopTimer();
    closeReview();
    var parts = (location.hash || '').replace(/^#\/?/, '').split('?')[0].split('/').map(function (p) { try { return decodeURIComponent(p); } catch (e) { return p; } });
    var name = parts[0] || 'dashboard';
    if (name === 'work' || name === 'client') name = 'approvals';
    if (name === 'portfolio') name = 'dashboard';
    if (name === 'reports') { window.location.href = reportHref(); return; }
    if (name === 'signals' && !viewInternal()) name = 'dashboard';
    if (name === 'property' && parts[1]) {
      setCompany(parts[1]);
      name = parts[2] ? { 'media-plan': 'mediaplan', visibility: 'visibility', content: 'content', creative: 'creative' }[parts[2]] || 'property' : 'property';
    }
    var screens = {
      dashboard: [screenDashboard, 'dashboard'], approvals: [screenApprovals, 'approvals'], item: [screenItem, 'approvals'],
      approved: [screenApproved, 'approvals'], properties: [screenProperties, 'properties'], property: [screenProperty, 'properties'],
      mediaplan: [screenMediaPlan, 'properties'], visibility: [screenVisibility, 'visibility'], content: [screenContent, 'content'],
      creative: [screenCreative, 'creative'], value: [screenValue, 'value'], signals: [screenSignals, 'signals'],
      ask: [screenAsk, ''], request: [screenRequest, 'approvals']
    };
    var s = screens[name] || screens.dashboard;
    renderSide(s[1]);
    window.scrollTo(0, 0);
    s[0](parts[1] || '');
  }

  function boot() {
    if (useClerk) loadClerk();
    view.innerHTML = loadingHtml('your workspace');
    api('/api/workspace/me').then(function (r) {
      state.me = r.data || {};
      if (!realInternal()) state.preview = false;
      var saved = null;
      try { saved = localStorage.getItem(COMPANY_KEY); } catch (e) {}
      state.companyId = companyById(saved) ? saved : (companies()[0] ? String(companies()[0].company_id) : null);
      window.addEventListener('hashchange', route);
      route();
      loadBadge();
    }).catch(function (err) {
      if (err && err.status === 401) return;
      view.innerHTML = errorHtml(err);
    });
  }
  boot();
})();
</script>
