<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer">
<title>RPM Digital | Workspace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script>window.__CLERK_PK__ = '';</script>   <!-- filled in at serve time from CLERK_PUBLISHABLE_KEY -->
<script>window.__PORTAL_API_BASE__ = '';</script>   <!-- filled in at serve time from PORTAL_API_BASE; '' = same origin -->
<style>
/* ── Tokens ────────────────────────────────────────────────────────────
   Structure, type scale, spacing and radii follow the v3 product design
   system. Every color is the RPM Living palette ("RPM Templates"):
   exact brand hexes for fills, rules, accents and charts; darker shades of
   the same hues for small text and button fills so every pair passes AA.
   Status colors are derived to sit with the palette (see the build plan). */
:root{
  --font-sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --text-fine:11px; --text-label:12px; --text-support:13px; --text-body:14px; --text-title:16px;
  --text-page:24px; --text-metric:32px; --text-metric-lg:44px;
  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-6:24px; --space-8:32px; --space-12:48px; --space-16:64px;
  --radius-sm:6px; --radius-md:8px; --radius-lg:12px; --radius-full:999px;

  /* Brand (exact) */
  --juniper:#444E4C; --black:#282D27; --gray:#76797A; --copper:#AB784A; --sage:#8BA395; --mint:#BDDDD9; --rule:#D9DEDC; --ink-on-dark:#E7EBE9;
  /* Brand shades for text and fills (same hues, darker for AA) */
  --copper-fill:#97693F; --copper-fill-hover:#86592F; --copper-ink:#8A6A3F; --gray-ink:#6F7372; --gray-ink-strong:#5E6261;
  /* Surfaces (tints of Ink-on-dark and Mint on white) */
  --color-bg:#FBFCFC; --color-card:#FFFFFF; --color-muted:#F3F5F4; --color-brand-soft:#E8F3F2;
  /* Roles */
  --color-fg:var(--black); --color-fg-2:var(--juniper); --color-fg-muted:var(--gray-ink);
  --color-border:var(--rule); --color-line:var(--ink-on-dark);
  --color-brand:var(--copper);
  /* Status: fill (dots, bars) · soft (backgrounds) · text (AA on white, bg and soft) */
  --healthy:#8BA395;   --healthy-soft:#ECF0EE;   --healthy-text:#5B7265;
  --attention:#C39A4B; --attention-soft:#F5EFE2; --attention-text:#86672D;
  --warning:#BF7B52;   --warning-soft:#F5EAE3;   --warning-text:#975C38;
  --critical:#B0544A;  --critical-soft:#F2E4E2;  --critical-text:#A34E45;
  --new:#76797A;       --new-soft:#E9EAEA;       --new-text:#676A6A;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none !important}
html,body{height:100%}
body{font-family:var(--font-sans);font-size:var(--text-body);line-height:22px;color:var(--color-fg);background:var(--color-bg);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;overflow-wrap:anywhere;font-feature-settings:"tnum"}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
ol,ul{list-style:none}
:focus-visible{outline:2px solid var(--copper-fill);outline-offset:2px;border-radius:4px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.skip{position:absolute;left:-999px;top:8px;z-index:60;background:var(--color-card);padding:8px 12px;border-radius:6px}
.skip:focus{left:8px}
.mono{font-family:var(--font-mono)}

/* ── Shell (App Shell EI-1) ─────────────────────────────────────────── */
.app{display:flex;min-height:100vh}
/* The column and its border run the full page height; the nav inside it stays in view. */
.side{width:240px;flex-shrink:0;background:var(--color-card);border-right:1px solid var(--color-border)}
.side-in{padding:12px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.logo{height:40px;display:flex;align-items:center;gap:10px;padding-inline:8px;margin-bottom:16px}
.logo b{font-weight:700;font-size:16px;line-height:20px;letter-spacing:.16em;color:var(--color-fg)}
.logo span{font-size:12px;line-height:16px;color:var(--color-fg-muted);letter-spacing:.04em}
.logo .logo-mark{height:32px;width:auto;display:block;flex-shrink:0}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-label{padding:20px 10px 6px;font-size:11px;line-height:14px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--color-fg-muted)}
.nav a{height:36px;display:flex;align-items:center;gap:10px;padding-inline:10px;border-radius:var(--radius-sm);font-size:13px;line-height:16px;font-weight:500;color:var(--color-fg-muted);transition:background-color .15s,color .15s}
.nav a svg{width:16px;height:16px;flex-shrink:0;stroke:currentColor}
.nav a .t{flex:1}
.nav a .count{font-size:11px;line-height:14px;font-weight:500;color:var(--color-fg-muted)}
.nav a .badge{height:18px;min-width:18px;padding-inline:5px;border-radius:var(--radius-full);background:var(--copper-fill);color:#fff;font-size:11px;line-height:18px;font-weight:600;text-align:center}
@media (hover:hover){.nav a:not([aria-current="page"]):hover{background:var(--color-muted);color:var(--color-fg)}}
.nav a[aria-current="page"]{background:var(--juniper);color:var(--ink-on-dark);font-weight:600}
.nav a[aria-current="page"] .count{color:var(--ink-on-dark)}
.side-grow{flex:1;min-height:12px}
.loopcard{display:flex;align-items:center;gap:10px;background:var(--color-brand-soft);border-radius:var(--radius-sm);padding:10px;margin-bottom:12px}
.loopcard i{width:8px;height:8px;border-radius:50%;background:var(--sage);flex-shrink:0;position:relative}
@media (prefers-reduced-motion:no-preference){.loopcard i.on::after{content:"";position:absolute;inset:0;border-radius:50%;background:var(--sage);animation:ping 2s cubic-bezier(0,0,.2,1) infinite}}
@keyframes ping{75%,100%{transform:scale(2.4);opacity:0}}
.loopcard b{display:block;font-size:12px;line-height:16px;font-weight:600;color:var(--juniper)}
.loopcard span{display:block;font-size:11px;line-height:14px;color:var(--gray-ink-strong);white-space:nowrap}
.side-bottom{border-top:1px solid var(--color-border);padding-top:12px;display:flex;flex-direction:column;gap:6px}
.userrow{display:flex;align-items:center;gap:10px;min-height:44px;padding-inline:10px}
.avatar{width:24px;height:24px;border-radius:50%;background:var(--juniper);color:#fff;font-size:10px;line-height:12px;font-weight:600;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.userrow div b{display:block;font-size:12px;line-height:16px;font-weight:600}
.userrow div span{display:block;font-size:11px;line-height:14px;color:var(--color-fg-muted)}
.previewtoggle{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:36px;padding:6px 10px;border-radius:var(--radius-sm);font-size:12px;line-height:16px;font-weight:500;color:var(--color-fg-2);width:100%;text-align:left}
.previewtoggle:hover{background:var(--color-muted)}
.switch{width:28px;height:16px;border-radius:999px;background:var(--rule);position:relative;flex-shrink:0;transition:background-color .15s}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:#fff;transition:transform .15s}
.previewtoggle[aria-pressed="true"] .switch{background:var(--copper-fill)}
.previewtoggle[aria-pressed="true"] .switch::after{transform:translateX(12px)}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{height:48px;flex-shrink:0;display:flex;align-items:center;gap:12px;padding-inline:16px;background:var(--color-card);border-bottom:1px solid var(--color-border);position:sticky;top:0;z-index:20}
.crumbs{display:flex;align-items:center;gap:8px;font-size:13px;line-height:16px;min-width:0;white-space:nowrap}
.crumbs b{font-weight:600}
.crumbs .sep{color:var(--color-fg-muted)}
.crumbs .ctx{color:var(--color-fg-muted);overflow:hidden;text-overflow:ellipsis}
.top-grow{flex:1}
.search-wrap{position:relative}
.search{width:280px;height:30px;display:flex;align-items:center;gap:8px;padding-inline:10px;background:var(--color-bg);border:1px solid var(--color-border);border-radius:var(--radius-md)}
.search:focus-within{outline:2px solid var(--copper-fill);outline-offset:1px}
.search svg{flex-shrink:0}
.search input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:13px;line-height:16px}
.search input::placeholder{color:var(--color-fg-muted)}
.kbd{background:var(--color-muted);border:1px solid var(--color-border);border-radius:4px;padding:1px 5px;font-size:11px;line-height:14px;font-weight:500;color:var(--color-fg-muted)}
.sresults{position:absolute;left:0;top:calc(100% + 6px);width:380px;max-height:420px;overflow-y:auto;background:var(--color-card);border:1px solid var(--color-border);border-radius:var(--radius-md);box-shadow:0 8px 24px rgba(40,45,39,.12);z-index:30;padding:6px}
.sgrp + .sgrp{border-top:1px solid var(--color-line);margin-top:4px;padding-top:4px}
.sgl{font-size:11px;line-height:14px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--color-fg-muted);padding:8px 10px 4px}
.sopt{display:flex;flex-direction:column;justify-content:center;gap:2px;padding:8px 10px;border-radius:var(--radius-sm);cursor:pointer;min-height:44px}
.sopt b{font-size:13px;line-height:16px;font-weight:500}
.sopt span{font-size:12px;line-height:16px;color:var(--color-fg-muted)}
.sopt:hover,.sopt[aria-selected="true"]{background:var(--color-muted)}
.sopt[aria-selected="true"]{box-shadow:inset 3px 0 0 var(--copper)}
.sempty{padding:10px;font-size:13px;line-height:18px;color:var(--color-fg-muted)}
.previewbar{display:flex;align-items:center;gap:12px;padding:8px 24px;background:var(--attention-soft);border-bottom:1px solid var(--color-border);font-size:13px;line-height:18px;color:var(--attention-text)}
.previewbar b{font-weight:600}
.previewbar .grow{flex:1}

/* Content + right rail */
main.content{display:flex;flex:1;min-height:0;align-items:stretch}
.page{flex:1;min-width:0;display:flex;flex-direction:column;gap:24px;padding:28px 32px 48px}
.rail{width:340px;flex-shrink:0;background:var(--color-card);border-left:1px solid var(--color-border);padding:28px 24px;display:flex;flex-direction:column;gap:20px}
.page.narrow{max-width:1140px}

/* ── Type roles (Design System 7H-1) ─────────────────────────────────── */
.h-page{font-size:24px;line-height:30px;font-weight:700;letter-spacing:-.02em}
.h-greet{font-size:24px;line-height:30px;font-weight:500;letter-spacing:-.01em}
.h-card{font-size:16px;line-height:20px;font-weight:600}
.h-sec{font-size:16px;line-height:20px;font-weight:500}
.h-rail{font-size:14px;line-height:18px;font-weight:600}
.eyebrow{font-size:12px;line-height:16px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--color-fg-muted)}
.support{font-size:13px;line-height:20px;color:var(--color-fg-muted)}
.fine{font-size:11px;line-height:14px;color:var(--color-fg-muted)}
.metric{font-size:32px;line-height:40px;font-weight:700;letter-spacing:-.02em}
.back{font-size:13px;line-height:16px;font-weight:500;color:var(--copper-ink);display:inline-flex;align-items:center;gap:4px;min-height:24px}
.back:hover,.link:hover{text-decoration:underline}
.link{font-size:13px;line-height:16px;font-weight:500;color:var(--copper-ink)}
.link.quiet{color:var(--color-fg-muted);font-weight:400}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.head .stack{display:flex;flex-direction:column;gap:4px;min-width:0}
.asof{font-size:12px;line-height:16px;color:var(--color-fg-muted);white-space:nowrap}
.gaps{font-size:13px;line-height:20px;color:var(--color-fg-muted)}
.receipt{font-size:12px;line-height:16px;color:var(--color-fg-muted)}

/* ── Controls ────────────────────────────────────────────────────────── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:36px;padding-inline:16px;border-radius:var(--radius-sm);font-size:14px;line-height:18px;font-weight:500;border:1px solid var(--color-border);background:var(--color-card);color:var(--color-fg);white-space:nowrap;transition:background-color .15s}
.btn:hover{background:var(--color-muted)}
.btn.primary{background:var(--copper-fill);border-color:var(--copper-fill);color:#fff;font-weight:600}
.btn.primary:hover{background:var(--copper-fill-hover)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--color-fg-muted)}
.btn.sm{height:30px;padding-inline:12px;font-size:13px;line-height:16px}
.btn.xs{height:28px;padding-inline:12px;font-size:12px;line-height:16px}
.btn.outline{border-color:var(--copper-fill);color:var(--copper-ink);background:var(--color-card)}
.btn.outline:hover{background:var(--color-brand-soft)}
.btn.big{height:46px;padding-inline:28px;font-size:15px;line-height:18px;font-weight:600}
.btn[disabled]{opacity:.6;cursor:progress}
.textbtn{font-size:12px;line-height:16px;color:var(--color-fg-muted);min-height:28px;padding-inline:4px}
.textbtn:hover{color:var(--color-fg);text-decoration:underline}
.textbtn.danger{color:var(--critical-text)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{height:28px;padding-inline:12px;border-radius:var(--radius-full);border:1px solid var(--color-border);background:var(--color-card);font-size:13px;line-height:16px;color:var(--color-fg-muted)}
.chip:hover{background:var(--color-muted)}
.chip[aria-pressed="true"]{background:var(--juniper);border-color:var(--juniper);color:var(--ink-on-dark);font-weight:500}
.pill{display:inline-flex;align-items:center;gap:6px;height:22px;padding-inline:10px;border-radius:var(--radius-full);font-size:12px;line-height:16px;font-weight:500;white-space:nowrap}
.pill i{width:5px;height:5px;border-radius:50%;background:currentColor;flex-shrink:0}
.pill.healthy{background:var(--healthy-soft);color:var(--healthy-text)}
.pill.attention{background:var(--attention-soft);color:var(--attention-text)}
.pill.warning{background:var(--warning-soft);color:var(--warning-text)}
.pill.critical{background:var(--critical-soft);color:var(--critical-text)}
.pill.new{background:var(--new-soft);color:var(--new-text)}
.pill.brand{background:var(--color-brand-soft);color:var(--juniper)}
.pill.fh{background:var(--color-muted);color:var(--juniper);border:1px solid var(--color-border)}
.tag{display:inline-flex;align-items:center;height:20px;padding-inline:8px;border-radius:4px;font-size:11px;line-height:14px;font-weight:500;white-space:nowrap}
.tag.cost{background:var(--healthy-soft);color:var(--healthy-text)}
.tag.vendor,.tag.content{background:var(--color-brand-soft);color:var(--juniper)}
.tag.negotiate{background:var(--attention-soft);color:var(--attention-text)}
.tag.creative{background:var(--color-muted);color:var(--gray-ink-strong)}
.tag.compliance{background:var(--critical-soft);color:var(--critical-text)}
.tag.internal{background:var(--color-muted);color:var(--gray-ink-strong);gap:4px}
/* A source this property does not have. Muted on purpose: it names a gap, it is not a warning. */
.tag.missing{background:var(--color-muted);color:var(--gray-ink-strong)}
.tags{display:inline-flex;gap:4px;flex-wrap:wrap}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex-shrink:0}
.dot.healthy{background:var(--healthy)} .dot.attention{background:var(--attention)} .dot.warning{background:var(--warning)} .dot.critical{background:var(--critical)} .dot.new{background:var(--new)} .dot.brand{background:var(--copper)}
.t-healthy{color:var(--healthy-text)} .t-attention{color:var(--attention-text)} .t-warning{color:var(--warning-text)} .t-critical{color:var(--critical-text)} .t-new{color:var(--new-text)} .t-brand{color:var(--copper-ink)}
.card{background:var(--color-card);border:1px solid var(--color-border);border-radius:var(--radius-md)}
.inline-err{font-size:13px;line-height:18px;color:var(--critical-text)}

/* KPI strip */
.kpis{display:flex;align-items:flex-start;border-bottom:1px solid var(--color-border);padding-bottom:20px;flex-wrap:wrap;row-gap:16px}
.kpi{display:flex;flex-direction:column;gap:4px;padding-inline:24px;border-left:1px solid var(--color-border);min-width:0}
.kpi:first-child{padding-left:0;border-left:0}
.kpi .eyebrow{letter-spacing:.04em}
.kpi .v{font-size:32px;line-height:40px;font-weight:700;letter-spacing:-.02em}
.kpi.sm .v{font-size:24px;line-height:30px}
.kpi .rc{font-size:11px;line-height:14px;color:var(--color-fg-muted)}
.kpi.emph .eyebrow{color:var(--color-fg-2);font-weight:600}
.kpiset{display:flex;flex-direction:column;gap:16px;border-bottom:1px solid var(--color-border);padding-bottom:20px}
.kpiset .kpis{display:grid;border-bottom:0;padding-bottom:0;row-gap:16px}
.kpis.row4,.kpis.row3{grid-template-columns:repeat(4,minmax(0,1fr))}
.kpis.row3{border-top:1px solid var(--color-line);padding-top:16px}

/* Tables (v3 pattern) */
.tscroll{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;padding:8px 12px 8px 0;border-bottom:1px solid var(--color-border);font-size:12px;line-height:16px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;color:var(--color-fg-muted);white-space:nowrap}
.tbl td{padding:10px 12px 10px 0;border-bottom:1px solid var(--color-line);font-size:13px;line-height:16px;vertical-align:middle}
.tbl td.name{font-size:14px;line-height:18px;font-weight:500}
.tbl .num{text-align:right}
.tbl tr.rowlink{cursor:pointer}
.tbl tr.rowlink:hover td{background:var(--color-muted)}
.tbl.boxed{border:1px solid var(--color-border);border-radius:var(--radius-md);border-collapse:separate;border-spacing:0;overflow:hidden;background:var(--color-card)}
.tbl.boxed th{background:var(--color-bg);padding:10px 16px;font-size:11px;line-height:14px;font-weight:600;letter-spacing:.05em}
.tbl.boxed td{padding:12px 16px}
.tbl.boxed tr:last-child td{border-bottom:0}
.tbl.boxed td:first-child,.tbl.boxed th{white-space:nowrap}
/* The page allows breaking long strings anywhere; tables keep whole words so column labels never split mid-word. */
.tbl{overflow-wrap:normal}
.tbl td.surface{white-space:nowrap}
.empty-dash{color:var(--color-fg-muted)}

/* States */
.state{padding:48px 32px;display:flex;flex-direction:column;gap:10px;max-width:560px}
.state h2{font-size:18px;line-height:24px;font-weight:600}
.state p{font-size:14px;line-height:21px;color:var(--color-fg-muted)}
.loading{display:flex;align-items:center;gap:10px;color:var(--color-fg-muted);font-size:13px}
.spinner{width:14px;height:14px;border:2px solid var(--color-line);border-top-color:var(--copper);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spinner{animation:none}}
.gate{position:fixed;inset:0;background:var(--juniper);z-index:2147483000;display:flex;align-items:center;justify-content:center;padding:16px}
@media (prefers-reduced-motion:no-preference){.page{animation:rise .3s ease-out}}
/* Motion only, never opacity: text stays at full contrast from the first frame. */
@keyframes rise{from{transform:translateY(8px)}to{transform:none}}
/* ── Dashboard (CXR-2, FYF-1 hero) ───────────────────────────────────── */
.greet{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.greet .stack{display:flex;flex-direction:column;gap:2px}
.hero{display:flex;align-items:center;gap:32px;background:var(--attention-soft);border:1px solid var(--rule);border-radius:var(--radius-sm);padding:22px 24px 22px 28px}
.hero .l{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.hero .q{font-size:20px;line-height:28px;font-weight:600;letter-spacing:-.01em}
.hero .body{font-size:14px;line-height:22px;color:var(--color-fg-2)}
.hero .r{width:220px;flex-shrink:0;display:flex;flex-direction:column;gap:8px}
.hero .r .btn{width:100%;height:40px}
.hero .r .link{align-self:flex-start;padding-top:2px}
.sec{display:flex;flex-direction:column;gap:10px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.tiles{display:flex;flex-wrap:wrap;gap:6px}
.tile{width:104px;min-height:62px;padding:8px 10px;border-radius:4px;display:flex;flex-direction:column;gap:2px;text-align:left}
.tile span{font-size:11px;line-height:14px;color:var(--color-fg-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile b{font-size:18px;line-height:22px;font-weight:700}
.tile.healthy{background:var(--healthy-soft)} .tile.healthy b{color:var(--healthy-text)}

/* ── Approvals (DDE-0, 1HM-0) ───────────────────────────────────────── */

/* ── Review panel (Round 4): side drawer on desktop, full screen on mobile ─ */

button.link{text-align:left;align-self:flex-start;min-height:24px}

.citebar{display:flex;height:24px;border-radius:4px;overflow:hidden}
.citebar i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;line-height:16px;color:var(--color-fg-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:2px;display:block}
.callout{border-radius:var(--radius-sm);padding:12px;display:flex;flex-direction:column;gap:6px;border-left:3px solid var(--attention);background:var(--attention-soft)}
.callout b{font-size:13px;line-height:16px;font-weight:600;color:var(--attention-text)}
.callout p{font-size:12px;line-height:18px;color:var(--color-fg-2)}
.callout.competitor{border-left-color:var(--critical);background:var(--critical-soft)}
.callout.competitor b{color:var(--critical-text)}
.nc{display:inline-flex;align-items:center;gap:6px;font-size:12px;line-height:16px;font-weight:500;white-space:nowrap}
.nc i{width:8px;height:8px;border-radius:50%;display:block;flex-shrink:0}
.nc.cited{color:var(--healthy-text)} .nc.cited i{background:var(--healthy)}
.nc.named{color:var(--juniper)} .nc.named i{background:var(--color-card);box-shadow:inset 0 0 0 2px var(--sage)}
.nc.none{color:var(--color-fg-muted)} .nc.none i{background:var(--rule)}
.tbl.boxed.qtbl td.q{white-space:normal;min-width:200px}
.tbl.boxed.qtbl.eng th,.tbl.boxed.qtbl.eng td{padding-inline:10px}
.tbl.boxed.qtbl.eng td.q .fine{display:block;margin-top:2px}
.tbl.boxed.qtbl td.q.mono{font-family:var(--font-mono);font-size:12px}
.card.writing{padding:4px 20px}
.wrow{display:flex;gap:16px;align-items:flex-start;padding:14px 0;border-top:1px solid var(--color-line)}
.wrow:first-child{border-top:0}
.wrow .wl{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.wrow .wl b{font-size:15px;line-height:20px;font-weight:600}
.wrow .wr{flex-shrink:0;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.chipsq{display:flex;flex-wrap:wrap;gap:6px}
.chipsq li{font-size:12px;line-height:16px;background:var(--color-muted);border-radius:var(--radius-sm);padding:3px 8px;color:var(--color-fg-2);font-family:var(--font-mono)}

/* ── Content (E4U-1) and Creative (E4S-1) ───────────────────────────── */
.prio{display:inline-flex;align-items:center;gap:6px;font-size:12px;line-height:16px;font-weight:500}
.tbl tr.top td{background:var(--color-brand-soft)}
.assets{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.asset{display:flex;flex-direction:column;gap:8px;padding-left:12px;border-left:2px solid transparent}
.asset.best{border-left-color:var(--healthy)}
.asset.worst{border-left-color:var(--critical)}
.asset .thumb{aspect-ratio:268/158;max-width:100%;border-radius:4px;display:flex;align-items:flex-end;padding:8px}
.asset .thumb span{font-size:11px;line-height:14px;color:var(--juniper);background:rgba(255,255,255,.85);border-radius:4px;padding:1px 6px}
.asset .fn{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-family:var(--font-mono);font-size:12px;line-height:16px}
.asset .tags{display:flex;gap:6px;flex-wrap:wrap}
.asset .tags span{height:20px;padding-inline:8px;border-radius:999px;font-size:11px;line-height:20px;background:var(--color-muted);color:var(--gray-ink-strong)}
.asset .tags span.generated{background:var(--color-brand-soft);color:var(--juniper)}
.asset .tags span.uploaded{background:var(--healthy-soft);color:var(--healthy-text)}
.dropzone{border:2px dashed var(--color-border);border-radius:var(--radius-md);padding:24px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.dropzone.over{background:var(--color-brand-soft);border-color:var(--copper)}
.uplist{display:flex;flex-direction:column;gap:10px}
.upf{display:grid;grid-template-columns:minmax(0,1fr) minmax(80px,200px);gap:4px 12px;align-items:center}
.upf .n{font-family:var(--font-mono);font-size:12px;line-height:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.upf .bar{height:6px;border-radius:3px;background:var(--rule);overflow:hidden}
.upf .bar i{display:block;height:100%;background:var(--copper-fill);transition:width .15s}
.upf.done .bar i{background:var(--healthy-text)}
.upf.err .bar i{background:var(--critical)}
.upf .st{grid-column:1/-1;font-size:12px;line-height:16px;color:var(--color-fg-muted)}
.upf.done .st{color:var(--healthy-text)}
.upf.err .st{color:var(--critical-text)}

/* ── Value (GC6-1) ──────────────────────────────────────────────────── */
.vhead{display:flex;flex-direction:column;gap:10px}
.vhead h1{font-size:28px;line-height:34px;font-weight:600;letter-spacing:-.02em;max-width:760px}
.figures{display:flex;align-items:flex-end;gap:72px;flex-wrap:wrap;row-gap:24px}
.fig{display:flex;flex-direction:column;gap:4px}
.fig .l{font-size:11px;line-height:14px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--color-fg-muted)}
.fig .big{font-size:56px;line-height:60px;font-weight:700;letter-spacing:-.03em}
.fig .mid{font-size:32px;line-height:40px;font-weight:700;letter-spacing:-.02em}
.ledger td,.ledger th{padding-inline:4px 20px}
.ledger tfoot td{border-top:2px solid var(--color-fg);border-bottom:0;padding-top:18px;font-weight:600}
.who.you{color:var(--copper-ink);font-weight:500}
.who.auto{color:var(--color-fg-muted);font-weight:500}
.who.team{color:var(--color-fg-2);font-weight:500}

/* ── Signals ─────────────────────────────────────────────────────────── */
.sgroup{display:flex;flex-direction:column;gap:0}
.grp{display:flex;align-items:center;gap:12px;padding:18px 0 10px}
.grp .rule{flex:1;height:1px;background:var(--color-border)}
.grp .eyebrow.high{color:var(--critical-text)} .grp .eyebrow.medium{color:var(--attention-text)}
.srow{display:flex;align-items:center;gap:16px;padding:14px 16px;border-bottom:1px solid var(--color-line);border-left:3px solid var(--color-border);flex-wrap:wrap;background:var(--color-card)}
.srow.sev-high{border-left-color:var(--critical)} .srow.sev-medium{border-left-color:var(--attention)}
.sc.prop{width:220px;flex-shrink:0;display:flex;flex-direction:column;gap:2px}
.sc.prop b{font-size:14px;line-height:18px;font-weight:600}
.sc.prop span,.sc.chg span{font-size:12px;line-height:16px;color:var(--color-fg-muted)}
.sc.what{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;font-size:13px;line-height:18px}
.sc.what .dtl{color:var(--color-fg-muted)}
.sc.chg{width:150px;flex-shrink:0;text-align:right;display:flex;flex-direction:column;gap:2px}
.sc.chg b{font-size:15px;line-height:18px;font-weight:600}
.sc.when{width:100px;flex-shrink:0;text-align:right;font-size:13px;line-height:16px;color:var(--color-fg-muted)}
.sc.act{width:150px;flex-shrink:0;display:flex;justify-content:flex-end}
.srow .inline-err{flex-basis:100%}

/* ── Ask ─────────────────────────────────────────────────────────────── */
.qlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px}
.qbtn{text-align:left;border:1px solid var(--color-border);border-radius:var(--radius-md);padding:12px 14px;display:flex;flex-direction:column;gap:4px;background:var(--color-card);min-height:44px}
.qbtn:hover{background:var(--color-muted)}
.qbtn b{font-size:14px;line-height:18px;font-weight:500}
.qbtn span{font-size:12px;line-height:17px;color:var(--color-fg-muted)}
.qa{display:flex;flex-direction:column;gap:16px;padding-bottom:20px;border-bottom:1px solid var(--color-border)}
.qbubble{display:flex;align-items:center;gap:12px;background:var(--color-muted);border-radius:var(--radius-md);padding:12px 16px;font-size:15px;line-height:20px;font-weight:500}
.answer{display:flex;gap:28px;align-items:flex-start}
.acol{flex:1;min-width:0;display:flex;flex-direction:column;gap:14px}
.headline{font-size:18px;line-height:28px}
.summary{font-size:14px;line-height:23px;color:var(--color-fg-2)}
.findings{display:flex;flex-direction:column;gap:10px}
.findings b{font-size:14px;line-height:20px;font-weight:600}
.findings p{font-size:14px;line-height:22px;color:var(--color-fg-2)}
.findings sup a{color:var(--copper-ink);font-weight:600;font-size:11px}
.receipts{width:320px;flex-shrink:0;background:var(--color-muted);border-radius:var(--radius-md);padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.receipts li{display:flex;gap:9px;font-size:13px;line-height:20px}
.receipts .n{width:14px;flex-shrink:0;color:var(--copper-ink);font-weight:600}
.receipts li.flash{background:var(--attention-soft)}
.refusal{display:flex;gap:12px;font-size:14px;line-height:22px;color:var(--color-fg-2)}

/* ── New request (artboard E) ────────────────────────────────────────── */
.req{display:flex;border:1px solid var(--color-border);border-radius:var(--radius-lg);overflow:hidden;min-height:680px;background:var(--color-card)}
.req-l{width:540px;flex-shrink:0;display:flex;flex-direction:column;gap:20px;padding:32px 34px}
.req-h{font-size:24px;line-height:30px;font-weight:600;letter-spacing:-.02em}
.req-sub{font-size:14px;line-height:21px;color:var(--color-fg-muted)}
.req-box{display:flex;background:var(--color-bg);border:1.5px solid var(--copper);border-radius:9px;padding:18px 19px;min-height:190px}
.req-box:focus-within{outline:2px solid var(--copper-fill);outline-offset:2px}
.req-box textarea{flex:1;border:0;outline:0;background:transparent;resize:vertical;font-size:15px;line-height:25px;caret-color:var(--copper);min-height:152px}
.req-box textarea::placeholder{color:var(--color-fg-muted)}
.req-row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.req-row .grow{flex:1}
.req-recent{border-top:1px solid var(--color-line);flex:1;display:flex;flex-direction:column;gap:11px;padding-top:22px}
.recent{display:flex;flex-direction:column;gap:11px}
.recent li{display:flex;align-items:center;gap:12px}
.recent .rt{flex:1;min-width:0;font-size:14px;line-height:18px}
.recent .rt a:hover{text-decoration:underline}
.recent .rs{display:flex;align-items:center;gap:6px;min-width:84px;font-size:13px;line-height:16px;font-weight:500;color:var(--color-fg-2)}
.recent .rs i{width:7px;height:7px;border-radius:50%;background:var(--juniper)}
.recent .rs i.done{background:var(--sage)} .recent .rs i.prog{background:var(--copper)}
.btn.send{width:100%;height:46px;border-radius:7px;font-size:14px}
.signin-row{text-align:center;padding:12px;font-size:14px}
.req-r{flex:1;min-width:0;background:var(--color-bg);border-left:1px solid var(--color-line);display:flex;flex-direction:column;gap:16px;padding:32px 34px}
.tcard{background:var(--color-card);border:1px solid var(--color-border);border-radius:var(--radius-md);display:flex;flex-direction:column;gap:11px;padding:16px 17px}
.ttop{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.ttitle{flex:1;min-width:0;font-size:15px;line-height:18px;font-weight:600;border:1px solid transparent;border-radius:4px;padding:2px 4px;margin:-3px -5px;background:transparent}
.ttitle:hover{border-color:var(--color-border)}
.tcat{appearance:none;-webkit-appearance:none;background:var(--color-muted);border:0;border-radius:4px;padding:3px 9px;font-size:11px;line-height:14px;font-weight:600;letter-spacing:.04em;color:var(--juniper);cursor:pointer}
.tfields{display:flex;flex-direction:column;gap:7px}
.tfields div{display:flex;align-items:center;gap:10px}
.tfields dt{width:78px;flex-shrink:0;font-size:12px;line-height:16px;font-weight:500;color:var(--color-fg-muted)}
.tfields dd{flex:1;min-width:0;font-size:13px;line-height:16px}
.tfields dd.need{display:flex;align-items:center;gap:4px;flex-wrap:wrap;color:var(--color-fg-muted);font-weight:500}
.need input{border:1px solid transparent;border-radius:4px;padding:1px 3px;margin:-2px -4px;font-size:13px;font-weight:500;color:var(--color-fg-2);background:transparent}
.need input:hover{border-color:var(--color-border)}
.twarn{display:flex;align-items:center;gap:8px;background:var(--attention-soft);border-radius:var(--radius-sm);padding:9px 11px;font-size:12px;line-height:18px;color:var(--attention-text)}
.tact{display:flex;justify-content:flex-end;margin-top:-4px}
.req-foot{border-top:1px solid var(--color-border);padding-top:14px;font-size:12px;line-height:18px;color:var(--color-fg-muted)}
.spacer{flex:1;min-height:8px}

.briefbox{display:flex;flex-direction:column;gap:6px}
.briefform{display:flex;flex-direction:column;gap:4px}
.briefrow{display:flex;gap:6px}
.briefrow input{flex:1;min-width:0;height:28px;border:1px solid var(--color-border);border-radius:var(--radius-sm);padding:0 8px;font-size:13px;background:var(--color-card)}
.briefrow input:focus{outline:2px solid var(--copper-fill);outline-offset:1px}

/* ── Spend (Round 5) ─────────────────────────────────────────────────── */
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end}
.controls .grow{flex:1}
.ctl{display:flex;flex-direction:column;gap:4px;min-width:0}
.ctl span{font-size:11px;line-height:14px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--color-fg-muted)}
.inp{height:36px;border:1px solid var(--color-border);border-radius:var(--radius-sm);padding:0 10px;background:var(--color-card);font-size:13px;line-height:16px;min-width:0;max-width:100%}
.inp:focus{outline:2px solid var(--copper-fill);outline-offset:1px}
.inp[type=search]{-webkit-appearance:none;appearance:none;box-sizing:border-box}
.inp.search-inp{width:240px}
.togglebtn{display:inline-flex;align-items:center;gap:6px;height:36px;padding-inline:12px;border-radius:var(--radius-sm);border:1px solid var(--color-border);background:var(--color-card);font-size:13px;line-height:16px;color:var(--color-fg-2)}
.togglebtn[aria-pressed="true"]{background:var(--color-brand-soft);border-color:var(--mint);color:var(--juniper);font-weight:500}
.spend-scroll{overflow:auto;max-height:calc(100vh - 290px);min-height:240px;border:1px solid var(--color-border);border-radius:var(--radius-md);background:var(--color-card)}
.stbl{border-collapse:separate;border-spacing:0;min-width:100%;overflow-wrap:normal}
.stbl th,.stbl td{padding:9px 12px;border-bottom:1px solid var(--color-line);font-size:13px;line-height:16px;white-space:nowrap;background:var(--color-card);text-align:left}
.stbl thead th{position:sticky;top:0;z-index:2;background:var(--color-bg);border-bottom:1px solid var(--color-border);font-size:11px;line-height:14px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--gray-ink-strong)}
.stbl thead th button{font:inherit;color:inherit;letter-spacing:inherit;text-transform:inherit;display:inline-flex;align-items:center;gap:4px;min-height:24px;text-align:inherit}
.stbl thead th[aria-sort] button{color:var(--color-fg)}
.stbl .num{text-align:right}
.stbl .num button{justify-content:flex-end}
.stbl th:first-child,.stbl td:first-child{position:sticky;left:0;z-index:1;border-right:1px solid var(--color-border);max-width:240px;overflow:hidden;text-overflow:ellipsis}
.stbl thead th:first-child{z-index:3}
.stbl tbody tr{cursor:pointer}
.stbl tbody tr:hover td{background:var(--color-muted)}
.stbl tbody td:first-child a{font-weight:500;font-size:14px}
.stbl tfoot td{position:sticky;bottom:0;z-index:1;background:var(--color-bg);font-weight:600;border-top:1px solid var(--color-border);border-bottom:0}
.stbl tfoot td:first-child{z-index:3}
.stbl .intcol{color:var(--gray-ink-strong)}
.stbl thead th.intcol{background:var(--color-muted)}
.stbl td.total{font-weight:600}
.spend-cards{display:none;flex-direction:column;gap:10px}
.scard{border:1px solid var(--color-border);border-radius:var(--radius-md);background:var(--color-card);padding:14px;display:flex;flex-direction:column;gap:8px}
.scard .top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.scard .top a{font-size:15px;line-height:20px;font-weight:600}
.scard .top b{font-size:18px;line-height:22px;font-weight:700;white-space:nowrap}
.chlist{display:flex;flex-direction:column}
.chlist li{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-top:1px solid var(--color-line);font-size:13px;line-height:18px}
.chlist li b{font-weight:600}
.scard details summary{cursor:pointer;min-height:44px;display:flex;align-items:center;font-size:13px;font-weight:500;color:var(--copper-ink)}
.picklist{display:flex;flex-direction:column;gap:8px}
.picklist button{display:flex;justify-content:space-between;gap:12px;width:100%;min-height:44px;padding:10px 14px;border:1px solid var(--color-border);border-radius:var(--radius-sm);background:var(--color-card);font-size:14px;line-height:18px;text-align:left}
.picklist button:hover{background:var(--color-muted)}
.picklist button span{color:var(--color-fg-muted)}
.sumline{font-size:13px;line-height:18px;color:var(--color-fg-muted)}
[data-spend-results]{display:flex;flex-direction:column;gap:12px;min-width:0}
.sumline b{color:var(--color-fg);font-weight:600}

/* ── Profile (Round 5) ───────────────────────────────────────────────── */
.prof-head{display:flex;gap:32px;align-items:flex-start;flex-wrap:wrap}
.prof-head .who{flex:1;min-width:240px;display:flex;flex-direction:column;gap:6px}
.meter{display:flex;flex-direction:column;gap:8px;width:320px;max-width:100%}
.meter .row1{display:flex;align-items:baseline;gap:8px}
.meter .row1 b{font-size:28px;line-height:34px;font-weight:700;letter-spacing:-.02em}
.meterbar{height:8px;border-radius:4px;background:var(--rule);overflow:hidden}
.meterbar i{display:block;height:100%;background:var(--juniper);border-radius:4px}
.missing{display:flex;flex-direction:column;gap:6px}
.missing li{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:start;gap:4px 12px;font-size:13px;line-height:18px}
.missing li .uchips{grid-column:1}
.missing li .link{grid-column:2;grid-row:1}
.missing li b{font-weight:500}
.checkin-note{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--attention-soft);border-radius:var(--radius-sm);padding:10px 14px;font-size:13px;line-height:18px;color:var(--attention-text)}
.checkin-note.done{background:var(--healthy-soft);color:var(--healthy-text)}
.checkin-note .link{color:inherit;text-decoration:underline}
.prof-layout{display:grid;grid-template-columns:220px minmax(0,1fr);gap:32px;align-items:start}
.secnav{position:sticky;top:64px;display:flex;flex-direction:column;gap:2px}
.secnav button{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;min-height:36px;padding:6px 10px;border-radius:var(--radius-sm);font-size:13px;line-height:16px;color:var(--color-fg-2);text-align:left}
.secnav button:hover{background:var(--color-muted)}
.secnav button span{font-size:12px;color:var(--color-fg-muted);font-variant-numeric:tabular-nums}
.psecs{display:flex;flex-direction:column;gap:12px;min-width:0}
.psec{border:1px solid var(--color-border);border-radius:var(--radius-md);background:var(--color-card);scroll-margin-top:64px}
.psec>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;padding:14px 18px;min-height:52px}
.psec>summary::-webkit-details-marker{display:none}
.psec>summary b{flex:1;font-size:16px;line-height:20px;font-weight:600}
.psec>summary .sp{font-size:13px;color:var(--color-fg-muted)}
.psec>summary .chev{transition:transform .15s}
.psec[open]>summary .chev{transform:rotate(180deg)}
.fields{padding:0 18px}
.fld{display:grid;grid-template-columns:minmax(150px,210px) minmax(0,1fr);gap:8px 24px;padding:16px 0;border-top:1px solid var(--color-line);scroll-margin-top:72px}
.fld .lab{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld .lab b{font-size:14px;line-height:18px;font-weight:600}
.fld .lab .fine{line-height:16px}
.uchips{display:flex;gap:4px;flex-wrap:wrap}
.uchip{display:inline-flex;align-items:center;gap:3px;height:20px;padding-inline:7px;border-radius:4px;font-size:11px;line-height:14px;font-weight:500;background:var(--color-muted);color:var(--gray-ink-strong);white-space:nowrap}
.uchip.ads{background:var(--attention-soft);color:var(--attention-text)}
.uchip.ai_answers,.uchip.website_faq{background:var(--color-brand-soft);color:var(--juniper)}
.uchip.reports{background:var(--healthy-soft);color:var(--healthy-text)}
.fld .body{display:flex;flex-direction:column;gap:8px;min-width:0}
.fval{font-size:14px;line-height:22px;white-space:pre-wrap}
.fval .pills{display:flex;gap:6px;flex-wrap:wrap}
.fval table{border-collapse:collapse;font-size:13px;line-height:16px}
.fval th,.fval td{padding:4px 12px 4px 0;text-align:left;border-bottom:1px solid var(--color-line)}

.prov{font-size:12px;line-height:16px;color:var(--color-fg-muted)}
.fstates{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.notebox{border-radius:var(--radius-sm);padding:8px 12px;font-size:13px;line-height:19px}
.notebox.pend{background:var(--attention-soft);color:var(--attention-text)}
.notebox.ok{background:var(--healthy-soft);color:var(--healthy-text)}
.notebox.no{background:var(--color-muted);color:var(--gray-ink-strong)}
.notebox.block{background:var(--critical-soft);color:var(--critical-text)}
.notebox b{font-weight:600}
.sugbox{border:1px solid var(--mint);background:var(--color-brand-soft);border-radius:var(--radius-sm);padding:10px 12px;display:flex;flex-direction:column;gap:8px}

.sugbox .fine{color:var(--gray-ink-strong)}
.facts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.editor{display:flex;flex-direction:column;gap:8px}
.editor textarea.inp{height:auto;min-height:104px;padding:8px 10px;resize:vertical;font-size:14px;line-height:21px}
.editor input.inp{height:40px;font-size:14px}
.checks{display:flex;gap:6px 16px;flex-wrap:wrap}
.checks label{display:inline-flex;align-items:center;gap:6px;min-height:32px;font-size:14px}
.hist{display:flex;flex-direction:column;gap:6px;border-left:2px solid var(--color-border);padding-left:12px}
.hist li{font-size:12px;line-height:17px;color:var(--color-fg-2)}
.hist li b{font-weight:600}

/* ── Profile update review (Round 5) ─────────────────────────────────── */
.diff{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.diff>div{border:1px solid var(--color-border);border-radius:var(--radius-sm);padding:10px 12px;display:flex;flex-direction:column;gap:6px;background:var(--color-bg)}
.diff p{font-size:14px;line-height:22px;white-space:pre-wrap}
.diff del{background:var(--critical-soft);color:var(--critical-text);text-decoration:line-through;border-radius:2px;padding:0 2px}
.diff ins{background:var(--healthy-soft);color:var(--healthy-text);text-decoration:none;border-radius:2px;padding:0 2px;font-weight:500}
.fhline{font-size:13px;line-height:19px}

/* ── Profile check-in card (Round 5) ─────────────────────────────────── */
.ckcard{border-left:3px solid var(--attention)}
.ckcard .sub{display:block;font-size:11px;line-height:14px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--attention-text)}
.todo-h{font-size:12px;line-height:16px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--color-fg-muted);padding-top:4px}

.profchip{display:inline-flex;align-items:center;gap:8px;font-size:13px;line-height:16px;font-weight:500;color:var(--copper-ink);min-height:24px}
.profchip .meterbar{width:72px;height:6px}
.profchip:hover{text-decoration:underline}

/* AA on tinted surfaces: small muted text steps down to the strong gray shade */
.pane .eyebrow,.pane .support,.finding .receipt,.receipts .support,.receipts .eyebrow,.tbl tr.top td.support,.tbl .self,
.tbl tr.rowlink:hover .fine,.tbl tr.rowlink:hover .empty-dash,.kbd,.chip:hover,.sopt:hover span,.sopt[aria-selected="true"] span,.hero .support{color:var(--gray-ink-strong)}
.hero .link{color:var(--attention-text)}

  .sresults{width:100%}
  .topbar .btn{height:44px}
  main.content{flex-direction:column}
  .page{padding:20px 16px 32px;gap:20px}
  .rail{width:auto;border-left:0;border-top:1px solid var(--color-border);padding:20px 16px}
  .kpi{padding-inline:16px}
  .kpi .v{font-size:26px;line-height:32px}

  .kpis.row4,.kpis.row3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .hero{flex-direction:column;align-items:stretch;gap:16px;padding:18px}
  .hero .r{width:auto}
  .btn,.chip,.rchip,.textbtn{min-height:44px}

  .drawer{width:100%;border-left:0;box-shadow:none}

  var SEARCH_TYPES = [['property', 'Properties'], ['work_item', 'Approvals and work'], ['report', 'Reports'], ['question', 'Questions']];
  function bindSearch(input) {
    var box = document.getElementById('search-results'), timer = null, seq = 0, opts = [], active = -1;
    function close() { box.hidden = true; input.setAttribute('aria-expanded', 'false'); input.removeAttribute('aria-activedescendant'); active = -1; }
    function open() { box.hidden = false; input.setAttribute('aria-expanded', 'true'); }
    function setActive(i) {
      opts.forEach(function (o, j) { o.el.setAttribute('aria-selected', String(j === i)); });
      active = i;
      if (i >= 0) { input.setAttribute('aria-activedescendant', opts[i].el.id); opts[i].el.scrollIntoView({ block: 'nearest' }); }
    }
    function go(r) {
      if (!r || typeof r.href !== 'string') return;
      var href = r.href;
      if (r.type === 'property' && r.company_id) href = '#/property/' + encodeURIComponent(r.company_id);
      if (r.type === 'report' && r.company_id) { window.location.href = reportUrl(r.company_id); return; }
      if (href.indexOf('#/') !== 0) return;
      close();
      if (r.company_id) setCompany(r.company_id);
      if (location.hash === href) route(); else location.hash = href;
    }
    function render(q, results) {
      var known = SEARCH_TYPES.map(function (t) { return t[0]; }), ordered = [], html = '';
      SEARCH_TYPES.concat([['__other', 'Other']]).forEach(function (g) {
        var rows = results.filter(function (r) { return g[0] === '__other' ? known.indexOf(r.type) === -1 : r.type === g[0]; });
        if (!rows.length) return;
        html += '<div class="sgrp" role="group" aria-labelledby="sg-' + g[0] + '"><p class="sgl" id="sg-' + g[0] + '">' + esc(g[1]) + '</p>' + rows.map(function (r) {
          var i = ordered.push(r) - 1;
          return '<div class="sopt" role="option" id="sr-' + i + '" aria-selected="false" data-i="' + i + '"><b>' + esc(r.title) + '</b>' + (has(r.subtitle) ? '<span>' + esc(r.subtitle) + '</span>' : '') + '</div>';
        }).join('') + '</div>';
      });
      box.innerHTML = ordered.length ? html : '<p class="sempty">No matches for “' + esc(q) + '”.</p>';

      if (q.length < 2) { seq++; opts = []; box.innerHTML = ''; close(); return; }

  /* ── Spend (Round 5) ─────────────────────────────────────────────────
     The spend sheet as a calm table. The server removes internal columns (and

     what it receives. Money never moves from here: "Propose a change" opens
     New request. Columns: Property · Status (staff) · Market · Manager ·
     channels · informational ILS columns · internal (staff) · Total. */
  state.spend = { q: '', market: '', manager: '', status: '', sort: 'property_name', dir: 'asc', showAll: false, showDeal: false };
  var SPEND_DEFAULT_INTERNAL = ['mgmt_fee'];
  var SPEND_MONEY_KEYS = { mgmt_fee: 1, deal_amount: 1, zillow_per_month: 1, zillow_per_lease: 1 };
  function spendQuery(page) {
    var f = state.spend, qs = ['page=' + page, 'page_size=200', 'sort=' + encodeURIComponent(f.sort), 'dir=' + f.dir];
    ['q', 'market', 'manager', 'status'].forEach(function (k) { if (f[k]) qs.push(k + '=' + encodeURIComponent(f[k])); });
    return '/api/workspace/spend-sheet?' + qs.join('&');
  }
  function loadSpend() {
    // Every page of the filtered set, so the table, totals and CSV cover the same rows.
    function next(page, acc) {

        var d = r.data || {}, rows = acc.concat(d.rows || []);
        if (rows.length < (d.count || 0) && (d.rows || []).length) return next(page + 1, rows);
        d.rows = rows;

    return next(1, []);
  }
  function hasSpendValue(v) { return v != null && v !== 0 && v !== '' && v !== false; }
  function isMoneyCol(c) { return c.key === 'total' || c.group === 'channel' || !!SPEND_MONEY_KEYS[c.key]; }

    var lead = [{ key: 'property_name', label: 'Property', row: true }];
    if (staff) lead.push({ key: 'status', label: 'Status', row: true, internal: true });
    lead.push({ key: 'market', label: 'Market', row: true }, { key: 'manager', label: 'Manager', row: true });
    var mid = (d.columns || []).filter(function (c) {
      if (c.group === 'channel' || c.group === 'meta') return f.showAll || used(c.key);

  function spendCell(r, c) { return c.row ? r[c.key] : (r.values || {})[c.key]; }
  function spendFmt(c, v) {

    if (v == null || v === '' || v === false) return null;
    return isMoneyCol(c) && typeof v === 'number' ? money(v) : String(v);

  function screenSpend() {

        list.map(function (v) { return '<option' + (v === f[key] ? ' selected' : '') + '>' + esc(v) + '</option>'; }).join('') + '</select></label>';
    }
    return '<div class="head"><div class="stack"><h1 class="h-page">Spend</h1><p class="support" data-spend-scope>Monthly contracted spend by channel, from your signed agreements.</p></div><span data-spend-asof></span></div>' +
      '<div class="controls" role="search"><label class="ctl"><span>Search</span><input class="inp search-inp" type="search" data-spend-q placeholder="Property name" value="' + esc(f.q) + '"></label>' +

  function refreshSpend() {

    function fail(e, what) { if (e && e.status === 401) return; err.hidden = false; err.textContent = failText(e, what); }
    ta.addEventListener('input', function () { st.text = ta.value; });
    view.querySelectorAll('.tcard [data-f]').forEach(function (el) { el.addEventListener('input', readTickets); el.addEventListener('change', readTickets); });
    view.querySelectorAll('[data-remove]').forEach(function (b) { b.addEventListener('click', function () { readTickets(); var id = b.getAttribute('data-remove'); st.tickets = st.tickets.filter(function (t) { return String(t.draft_id) !== id; }); renderRequest('#heard-h'); }); });
    view.querySelectorAll('[data-draft]').forEach(function (b) {
      b.addEventListener('click', function () {
        if (!st.text.trim()) { err.hidden = false; err.textContent = 'Write what you need first.'; ta.focus(); return; }
        var label = b.textContent; b.disabled = true; b.textContent = 'Reading…';
        api('/api/workspace/requests/draft', { method: 'POST', body: { company_id: state.companyId, text: st.text } }).then(function (r) {
          var d = r.data || {}; st.tickets = d.tickets || []; st.gaps = d.gaps || []; st.sent = null; renderRequest('#heard-h');
        }).catch(function (e) { b.disabled = false; b.textContent = label; fail(e, 'We couldn’t draft that'); });
      });
    });
    var send = view.querySelector('[data-send]');
    if (send) send.addEventListener('click', function () {
      readTickets();
      if (st.tickets.some(function (t) { return !String(t.title || '').trim(); })) { err.hidden = false; err.textContent = 'Every ticket needs a title.'; return; }
      send.disabled = true; send.textContent = 'Sending…';
      var outgoing = st.tickets.map(function (t) { var c = {}; for (var k in t) if (k !== 'failed') c[k] = t[k]; return c; });
      api('/api/workspace/requests', { method: 'POST', body: { company_id: state.companyId, tickets: outgoing } }).then(function (r) {
        var d = r.data || {}, failed = {};
        (d.failed || []).forEach(function (f) { failed[f.draft_id] = f.reason || 'not filed'; });
        st.sent = { created: d.created || [], tickets: outgoing };
        st.tickets = outgoing.filter(function (t) { return failed[t.draft_id]; }).map(function (t) { t.failed = failed[t.draft_id]; return t; });
        if (!st.tickets.length) st.text = '';
        renderRequest('#heard-h');
      }).catch(function (e) { send.disabled = false; send.textContent = 'Send it'; fail(e, 'That didn’t send'); });
    });
  }



  /* ── RPMI (RPM only) ─────────────────────────────────────────────────
     The RPM Investments book in one view. Coverage leads, because coverage is
     the honest headline: availability is on most of the roster and the leasing
     funnel on a fraction of it, so most rows are partial by design.

     Two rules the rest of this page already follows, applied strictly here:
     a number we do not have is left OUT rather than drawn as a dash, and the
     row says what it is missing in the same words a client would read. The
     table reuses .tbl, .controls and the sumline; nothing new was invented. */
  state.rpmi = { q: '', sort: 'units_at_risk', dir: 'desc' };
  var RPMI_COLS = [
    { key: 'name', label: 'Property' },
    { key: 'where', label: 'City / state' },
    { key: 'units', label: 'Units', num: true, fmt: num },
    { key: 'occupancy', label: 'Occupancy', num: true, fmt: function (v) { return pct(v, 1); } },
    { key: 'units_at_risk', label: 'Units at risk', num: true, fmt: num },
    { key: 'leases_last_month', label: 'Leases', num: true, fmt: num },
    { key: 'cost_per_lease', label: 'Cost / lease', num: true, fmt: money },
    { key: 'spend_monthly', label: 'Spend', num: true, fmt: moneyK },
    { key: 'open_recommendations', label: 'Open', num: true, fmt: num },
    { key: 'missing', label: 'Not connected' }
  ];
  var RPMI_KPIS = [
    ['units', 'Units'], ['occupancy', 'Occupancy'], ['units_at_risk', 'Units at risk'],
    ['leases_last_month', 'Leases last month'], ['cost_per_lease', 'Cost per lease'],
    ['spend_monthly', 'Spend a month'], ['open_recommendations', 'Open recommendations']
  ];
  var RPMI_KPI_FMT = {
    units: num, occupancy: function (v) { return pct(v, 1); }, units_at_risk: num,
    leases_last_month: num, cost_per_lease: money, spend_monthly: moneyK, open_recommendations: num
  };

  function rpmiWhere(r) { return [r.city, r.state].filter(Boolean).join(', '); }
  function rpmiSortable(c) { return c.key !== 'missing'; }
  function rpmiValue(r, key) {
    if (key === 'name') return (r.name || '').toLowerCase();
    if (key === 'where') return rpmiWhere(r).toLowerCase();
    return val(r[key]);
  }
  function rpmiLabels(d) {
    var out = {};
    (((d.coverage || {}).sources) || []).forEach(function (s) { out[s.key] = s.label; });
    return out;
  }
  function rpmiMissing(r) {
    return Object.keys(r.sources || {}).filter(function (k) { return !r.sources[k]; });
  }
  function rpmiRows(d) {
    var f = state.rpmi, q = f.q.toLowerCase();
    var rows = (d.properties || []).filter(function (r) {
      if (!q) return true;
      return (r.name || '').toLowerCase().indexOf(q) !== -1 || rpmiWhere(r).toLowerCase().indexOf(q) !== -1;
    });
    // A missing number never outranks a known one, whichever way the column sorts.
    var dir = f.dir === 'asc' ? 1 : -1;
    return rows.slice().sort(function (a, b) {
      var x = rpmiValue(a, f.sort), y = rpmiValue(b, f.sort);
      if (x == null && y == null) return (a.name || '').localeCompare(b.name || '');
      if (x == null) return 1;
      if (y == null) return -1;
      if (x === y) return (a.name || '').localeCompare(b.name || '');
      return x > y ? dir : -dir;
    });
  }

  function screenRpmi() {
    renderTop('RPMI', '');
    renderSide('rpmi');
    setView('<div class="page">' + rpmiHead() + '<div data-rpmi-results>' +
      '<div class="loading" role="status"><span class="spinner" aria-hidden="true"></span>Loading the RPMI portfolio…</div></div></div>');
    bindRpmiControls();
    // Not guard(): guard replaces the whole view with its own loading state,
    // which would take the search box and the results container with it. The
    // head stays put and only the results box swaps, the way Spend does it.
    api('/api/workspace/rpmi').then(function (r) {
      state.rpmiData = r.data || {};
      renderRpmi();
    }).catch(function (e) {
      var box = view.querySelector('[data-rpmi-results]');
      if (box && !(e && e.status === 401)) box.innerHTML = errorHtml(e);
    });
  }
  function rpmiHead() {
    return '<div class="head"><div class="stack"><h1 class="h-page">RPMI</h1>' +
      '<p class="support" data-rpmi-scope>The RPM Investments portfolio, ranked by units at risk.</p></div>' +
      '<span data-rpmi-asof></span></div>' +
      '<div class="controls" role="search"><label class="ctl"><span>Search</span>' +
      '<input class="inp search-inp" type="search" data-rpmi-q placeholder="Property, city or state" value="' + esc(state.rpmi.q) + '"></label></div>';
  }
  function bindRpmiControls() {
    var q = view.querySelector('[data-rpmi-q]'), timer = null;
    if (!q) return;
    q.addEventListener('input', function () {
      clearTimeout(timer);
      timer = setTimeout(function () { state.rpmi.q = q.value.trim(); renderRpmi(); }, 200);
    });
  }
  function renderRpmi() {
    var box = view.querySelector('[data-rpmi-results]'), d = state.rpmiData;
    if (!box || !d) return;
    var scope = view.querySelector('[data-rpmi-scope]');
    if (scope && has(d.scope_label)) scope.textContent = d.scope_label + ' — ranked by units at risk.';
    var asof = view.querySelector('[data-rpmi-asof]');
    if (asof) asof.innerHTML = staleLabel(d.as_of);

    if (!(d.properties || []).length) {
      box.innerHTML = '<div class="state"><h2>No RPM Investments properties to show</h2>' +
        '<p>' + esc(((d.gaps || [])[0] || {}).message || 'Nothing is set up for reporting here yet.') + '</p></div>';
      return;
    }

    var rows = rpmiRows(d), labels = rpmiLabels(d), f = state.rpmi;
    // KPI strip: only the numbers we actually have. A null is left out, not dashed.
    var kpis = RPMI_KPIS.map(function (k) { return { key: k[0], label: k[1], r: (d.totals || {})[k[0]] }; })
      .filter(function (k) { return val(k.r) != null; })
      .map(function (k) {
        return '<div class="kpi sm"' + rtitle(k.r) + '><span class="eyebrow">' + esc(k.label) + '</span>' +
          '<span class="v">' + esc(RPMI_KPI_FMT[k.key](val(k.r))) + '</span>' +
          (receipt(k.r) ? '<span class="rc">' + receipt(k.r) + '</span>' : '') + '</div>';
      }).join('');

    var cov = d.coverage || {}, of = cov.property_count || 0;
    var strip = (cov.sources || []).map(function (s, i) {
      return '<b>' + esc(s.label) + '</b> on ' + esc(num(s.count)) + (i === 0 ? ' of ' + esc(num(of)) : '');
    }).join(' · ');

    var head = '<tr>' + RPMI_COLS.map(function (c) {
      var sorted = f.sort === c.key, cls = c.num ? 'num' : '';
      if (!rpmiSortable(c)) return '<th scope="col" class="' + cls + '">' + esc(c.label) + '</th>';
      return '<th scope="col" class="' + cls + '"' + (sorted ? ' aria-sort="' + (f.dir === 'asc' ? 'ascending' : 'descending') + '"' : '') +
        '><button type="button" data-rpmi-sort="' + esc(c.key) + '">' + esc(c.label) +
        (sorted ? '<span aria-hidden="true">' + (f.dir === 'asc' ? '↑' : '↓') + '</span>' : '') + '</button></th>';
    }).join('') + '</tr>';

    var body = rows.map(function (r) {
      var href = r.href || ('#/property/' + encodeURIComponent(r.company_id));
      var miss = rpmiMissing(r);
      var why = (r.gaps || []).map(function (g) { return g.message; }).filter(Boolean).join(' ');
      return '<tr class="rowlink" data-href="' + esc(href) + '">' + RPMI_COLS.map(function (c) {
        if (c.key === 'name') return '<td class="name"><a href="' + esc(href) + '">' + esc(r.name || 'Unnamed property') + '</a></td>';
        if (c.key === 'where') return '<td>' + (has(rpmiWhere(r)) ? esc(rpmiWhere(r)) : '') + '</td>';
        if (c.key === 'missing') {
          return '<td>' + (miss.length
            ? '<span class="tags"' + (why ? ' title="' + esc(why).replace(/&amp;/g, '&') + '"' : '') + '>' +
              miss.map(function (k) { return '<span class="tag missing">' + esc(labels[k] || k) + '</span>'; }).join('') + '</span>'
            : '') + '</td>';
        }
        var v = val(r[c.key]);
        // Hidden, not dashed: the "Not connected" column says why it is blank.
        return '<td class="num"' + rtitle(r[c.key]) + '>' + (v == null ? '' : esc(c.fmt(v))) + '</td>';
      }).join('') + '</tr>';
    }).join('');

    box.innerHTML = (kpis ? '<div class="kpis">' + kpis + '</div>' : '') +
      (strip ? '<p class="sumline">' + strip + '</p>' : '') +
      '<p class="sumline" role="status"><b>' + esc(num(rows.length)) + '</b> ' + plural(rows.length, 'property', 'properties') +
      (rows.length !== (d.properties || []).length ? ' of ' + esc(num((d.properties || []).length)) : '') + '</p>' +
      (rows.length
        ? '<div class="tscroll"><table class="tbl"><caption class="sr-only">RPM Investments properties, ranked by units at risk</caption>' +
          '<thead>' + head + '</thead><tbody>' + body + '</tbody></table></div>'
        : '<p class="support">No properties match that search.</p>') +
      gapsLine(d.gaps);

    box.querySelectorAll('[data-rpmi-sort]').forEach(function (b) {
      b.addEventListener('click', function () {
        var key = b.getAttribute('data-rpmi-sort');
        if (f.sort === key) f.dir = f.dir === 'asc' ? 'desc' : 'asc';
        else { f.sort = key; f.dir = (key === 'name' || key === 'where') ? 'asc' : 'desc'; }
        renderRpmi();
      });
    });
  }

  /* ── Router ──────────────────────────────────────────────────────── */
  function route() {
    stopTimer();
    closeReview();
    var parts = (location.hash || '').replace(/^#\/?/, '').split('?')[0].split('/').map(function (p) { try { return decodeURIComponent(p); } catch (e) { return p; } });
    var name = parts[0] || 'dashboard';
    if (name === 'work' || name === 'client') name = 'approvals';
    if (name === 'portfolio') name = 'dashboard';
    if (name === 'reports') { window.location.href = reportHref(); return; }
    if ((name === 'signals' || name === 'rpmi' || name === 'geo') && !viewInternal()) name = 'dashboard';
    if (name === 'property' && parts[1]) {
      setCompany(parts[1]);
      name = parts[2] ? { 'media-plan': 'mediaplan', visibility: 'visibility', content: 'content', creative: 'creative', profile: 'profile' }[parts[2]] || 'property' : 'property';
    }
    var screens = {
      dashboard: [screenDashboard, 'dashboard'], approvals: [screenApprovals, 'approvals'], item: [screenItem, 'approvals'],
      approved: [screenApproved, 'approvals'], properties: [screenProperties, 'properties'], property: [screenProperty, 'properties'],
      mediaplan: [screenMediaPlan, 'properties'], visibility: [screenVisibility, 'visibility'], content: [screenContent, 'content'],
      creative: [screenCreative, 'creative'], value: [screenValue, 'value'], signals: [screenSignals, 'signals'],
      ask: [screenAsk, ''], request: [screenRequest, 'approvals'], spend: [screenSpend, 'spend'], profile: [screenProfile, 'profile'],
      rpmi: [screenRpmi, 'rpmi'], geo: [screenGeo, 'geo']
    };
    state.profileView = name === 'profile' ? (parts[3] || '') : '';
    var s = screens[name] || screens.dashboard;
    renderSide(s[1]);
    window.scrollTo(0, 0);
    s[0](parts[1] || '');
  }

  function boot() {
    if (useClerk) loadClerk();
    if (noAuthPossible) {
      showSignIn('Sign-in is not configured for this page yet. Tell the RPM digital team the workspace publishable key is missing.');
      return;
    }
    view.innerHTML = loadingHtml('your workspace');
    api('/api/workspace/me').then(function (r) {
      state.me = r.data || {};
      if (!realInternal()) state.preview = false;
      var saved = null;
      try { saved = localStorage.getItem(COMPANY_KEY); } catch (e) {}
      state.companyId = companyById(saved) ? saved : (companies()[0] ? String(companies()[0].company_id) : null);
      window.addEventListener('hashchange', route);
      route();
      loadBadge();
    }).catch(function (err) {
      if (err && err.status === 401) return;
      view.innerHTML = errorHtml(err);
    });
  }
  boot();
})();
</script>
