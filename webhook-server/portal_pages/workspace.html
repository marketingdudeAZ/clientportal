  function propertyHtml(d) {
    var sub = [];
    if (has(d.address)) sub.push(esc(d.address));
    if (has(d.domain)) sub.push('<a class="plain-link" href="https://' + esc(d.domain) + '" target="_blank" rel="noopener noreferrer">' + esc(d.domain) + '</a>');
    if (has(d.managed_since)) sub.push('managed since ' + monthYear(d.managed_since));
    var left = '';
    if (d.brief && has(d.brief.text)) {
      var b = d.brief;
      var by = b.curated
        ? 'Written by the ' + (b.edited_by || 'team') + (b.edited_at ? ', last edited ' + mdy(b.edited_at) : '') + ' · overrides the machine-drafted version'
        : 'Machine-drafted' + (b.edited_at ? ' · ' + mdy(b.edited_at) : '');
      left += '<section class="sec"><div class="row9"><h2 class="eyebrow dark">The brief</h2>' + (b.curated ? '<span class="pill grey tiny">CURATED</span>' : '') + '</div>' +
        '<p class="brief">' + esc(b.text) + '</p><p class="caption">' + esc(by) + '</p></section>';
    }
    if (has(d.floorplans)) {
      var plans = d.floorplans.slice().sort(function (a, c) { return (c.available || 0) - (a.available || 0); });
      var SHOW = 4;
      left += '<section class="sec"><h2 class="eyebrow dark">Floorplans</h2><ul class="fps">' + plans.map(function (f, i) {
        var beds = f.beds === 0 ? 'Studio' : (f.beds != null ? f.beds + ' bed' : '');
        return '<li class="fp"' + (i >= SHOW ? ' hidden' : '') + '><b>' + esc(f.code) + '</b><span>' + esc([beds, f.sqft != null ? num(f.sqft) + ' sf' : ''].filter(Boolean).join(' · ')) + '</span>' +
          (f.available != null ? '<span class="' + (f.available >= 5 ? 'hot' : '') + '">' + esc(num(f.available)) + ' available</span>' : '') + '</li>';
      }).join('') + (plans.length > SHOW ? '<li class="fp more"><button type="button" class="link" data-more-plans>+' + (plans.length - SHOW) + ' more</button></li>' : '') + '</ul></section>';
    }
    var right = '';
    if (has(d.people)) {
      right += '<section class="panel-soft"><h2 class="eyebrow">Who’s on it</h2><ul class="people">' + d.people.map(function (p, i) {
        return '<li><span class="av' + (i % 2 ? ' alt' : '') + '" aria-hidden="true">' + esc(initials(p.name)) + '</span><span class="pp"><b>' + esc(p.name) + '</b><span>' + esc(p.role) + '</span></span></li>';
      }).join('') + '</ul></section>';
    }
    if (has(d.connections)) {
      right += '<section class="sec"><h2 class="eyebrow dark">Connected</h2><ul class="conns">' + d.connections.map(function (c) {
        var ok = c.status === 'connected';
        return '<li><span class="dot' + (ok ? '' : ' off') + '" aria-hidden="true"></span><span class="cn">' + esc(c.name) + '</span>' +
          '<span class="cs' + (ok ? '' : ' off') + '">' + esc(ok ? (c.synced_at ? 'synced ' + asOf(c.synced_at) : 'connected') : 'not connected') + '</span></li>';
      }).join('') + '</ul></section>';
    }
    return '<div class="page"><div class="head"><div class="stack"><h1 class="h1">' + esc(d.name || (company() || {}).name || 'Property') + '</h1>' +
      (sub.length ? '<p class="lede">' + sub.join(' · ') + '</p>' : '') + '</div></div>' +
      '<div class="two"><div class="col-main">' + (left || '<p class="caption">No brief or floorplans on record yet.</p>') + '</div>' +
      (right ? '<div class="col-side">' + right + '</div>' : '') + '</div>' + gapsLine(d.gaps) + '</div>';
  }

  /* ── Performance ─────────────────────────────────────────────────── */
  var RANGES = [['30', '30 days'], ['90', '90 days'], ['365', '12 months']];
  function screenPerformance() {
    var range = state.perfRange || '30';
    guard(api('/api/workspace/performance?' + cq() + '&range=' + range), 'performance').then(function (r) {
      if (!r) return;
      setMain(performanceHtml(r.data || {}, range));
      main.querySelectorAll('[data-range]').forEach(function (b) {
        b.addEventListener('click', function () { state.perfRange = b.getAttribute('data-range'); screenPerformance(); });
      });
    });
  }

  function statCell(big, label, sub, subClass, rc) {
    return '<div class="stat"><span class="big">' + esc(big) + '</span><span class="slbl">' + esc(label) + '</span>' +
      (sub ? '<span class="ssub ' + (subClass || '') + '">' + esc(sub) + '</span>' : '') +
      (receipt(rc) ? '<span class="receipt">' + receipt(rc) + '</span>' : '') + '</div>';
  }

  function performanceHtml(d, range) {
    var cells = '';
    var o = d.occupied;
    if (o && o.value != null) cells += statCell(pct(o.value, 1), 'Occupied',
      [o.units != null && o.total != null ? num(o.units) + ' of ' + num(o.total) : '', o.target != null ? 'target ' + pct(o.target) : ''].filter(Boolean).join(' · '), '', o);
    var a = d.available_now;
    if (a && a.value != null) cells += statCell(num(a.value), 'Available now', a.stale_90_plus ? num(a.stale_90_plus) + ' sitting 90+ days' : '', a.stale_90_plus ? 'bad' : '', a);
    var c = d.coming_open_90d;
    if (c && c.value != null) cells += statCell(num(c.value), 'Coming open, 90d', c.one_bed != null ? num(c.one_bed) + ' of them one-beds' : '', '', c);
    var m = d.monthly_plan;
    if (m && m.value != null) {
      var by = m.by_channel ? Object.keys(m.by_channel).map(function (k) { return money(m.by_channel[k]) + ' ' + (k === 'seo' ? 'SEO' : channelName(k).toLowerCase()); }).join(' · ') : '';
      cells += statCell(money(m.value), 'Monthly plan', by, '', m);
    }
    var chips = RANGES.map(function (x) {
      return '<button type="button" class="chip" aria-pressed="' + (x[0] === range) + '" data-range="' + x[0] + '">' + x[1] + '</button>';
    }).join('');
    return '<div class="page perf"><div class="head"><div class="stack"><h1 class="h1">Performance</h1><p class="lede">Where the property is today, and what moved.</p></div>' +
      '<div class="chips" role="group" aria-label="Time range">' + chips + '</div></div>' +
      (cells ? '<div class="stats">' + cells + '</div>' : '') +
      (has(d.coming_by_week) ? chartHtml(d.coming_by_week, c) : '') +
      (has(d.note) ? '<p class="note13">' + esc(d.note) + '</p>' : '') + gapsLine(d.gaps) + '</div>';
  }

  function chartHtml(weeks, rc) {
    var H = 170, gap = 2, n = weeks.length, colW = 100, pad = 14;
    var max = 0, peak = -1;
    weeks.forEach(function (w, i) { var t = (w.one_bed || 0) + (w.two_bed || 0) + (w.other || 0); if (t > max) { max = t; peak = i; } });
    var unit = max ? (H - 10) / max : 0;
    var W = n * colW;
    var rects = '';
    weeks.forEach(function (w, i) {
      var x = i * colW + pad / 2, bw = colW - pad, y = H;
      [['other', '#D6DEDB'], ['two_bed', '#8BA395'], ['one_bed', '#AB784A']].forEach(function (s) {
        var v = w[s[0]] || 0; if (!v) return;
        var h = v * unit;
        y -= h;
        rects += '<rect x="' + x + '" y="' + y.toFixed(1) + '" width="' + bw + '" height="' + (h - (y > 0 ? 0 : 0)).toFixed(1) + '" fill="' + s[1] + '"/>';
        y -= gap;
      });
    });
    var labels = weeks.map(function (w, i) { return '<span' + (i === peak ? ' class="peak"' : '') + '>' + esc(slash(w.week_start)) + '</span>'; }).join('');
    var rows = weeks.map(function (w) {
      return '<tr><th scope="row">Week of ' + esc(mdy(w.week_start)) + '</th><td>' + (w.one_bed || 0) + '</td><td>' + (w.two_bed || 0) + '</td><td>' + (w.other || 0) + '</td></tr>';
    }).join('');
    return '<section class="chart"><div class="chart-head"><div class="stack4"><h2 class="eyebrow dark">Units coming available, by week</h2>' +
      (receipt(rc) ? '<span class="receipt">' + receipt(rc) + '</span>' : '') + '</div>' +
      '<div class="legend2" aria-hidden="true"><span><i style="background:#AB784A"></i>One-bed</span><span><i style="background:#8BA395"></i>Two-bed</span><span><i style="background:#D6DEDB"></i>Other</span></div></div>' +
      '<div class="bars"><svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" width="100%" height="' + H + '" role="img" aria-label="Stacked bars of units coming available each week; the table that follows has the numbers">' + rects + '</svg></div>' +
      '<div class="xlabels" aria-hidden="true">' + labels + '</div>' +
      '<table class="sr-only"><caption>Units coming available, by week</caption><thead><tr><th scope="col">Week</th><th scope="col">One-bed</th><th scope="col">Two-bed</th><th scope="col">Other</th></tr></thead><tbody>' + rows + '</tbody></table></section>';
  }

  /* ── Plan & Spend ────────────────────────────────────────────────── */
  function screenPlan() {
    guard(api('/api/workspace/plan?' + cq()), 'the plan').then(function (r) {
      if (!r) return;
      setMain(planHtml(r.data || {}));
    });
  }

  function planHtml(d) {
    var sub = [];
    if (d.monthly_total != null) sub.push(money(d.monthly_total) + ' a month' + (d.channel_count != null ? ' across ' + word(d.channel_count, true) + ' ' + plural(d.channel_count, 'channel') : '') + '.');
    if (d.pending_changes) sub.push(word(d.pending_changes) + ' ' + plural(d.pending_changes, 'change') + ' pending.');
    var chans = d.channels || [];
    var FILL = ['#97693F', '#C09A6E', '#8BA395', '#A9BCB1'];
    var INK = ['#FFFFFF', '#282D27', '#282D27', '#282D27'];
    var segs = '', used = 0, shown = 0, rest = 0;
    chans.forEach(function (c) {
      if (c.share == null) return;
      if (c.share >= 0.08 && shown < FILL.length) {
        segs += '<div class="seg" style="width:' + (c.share * 100).toFixed(2) + '%;background:' + FILL[shown] + ';color:' + INK[shown] + '" title="' + esc(c.channel + ' ' + pct(c.share)) + '"><span>' + esc(shortChannel(c.channel) + ' ' + pct(c.share)) + '</span></div>';
        shown++; used += c.share;
      } else rest += c.share;
    });
    var restShare = Math.max(0, 1 - used);
    if (segs && restShare > 0.005) segs += '<div class="seg" style="width:' + (restShare * 100).toFixed(2) + '%;background:#D6DEDB;color:#3C4240" title="Everything else ' + pct(restShare) + '"><span>Rest</span></div>';
    var minCpl = null;
    chans.forEach(function (c) { if (c.cost_per_lease != null && (minCpl == null || c.cost_per_lease < minCpl)) minCpl = c.cost_per_lease; });
    var rows = chans.map(function (c) {
      var st = String(c.status || '').toLowerCase(), label = c.status_note || (st ? st.charAt(0).toUpperCase() + st.slice(1).replace(/_/g, ' ') : '');
      var status = st === 'pending' ? '<span class="pill amber">' + esc(label) + '</span>'
        : (/end|expired|paused|stopped/.test(st) ? '<span class="pill red">' + esc(label) + '</span>' : '<span class="plain">' + esc(label) + '</span>');
      return '<tr><th scope="row">' + esc(c.channel) + '</th><td class="num">' + esc(money(c.monthly)) + '</td>' +
        '<td class="num' + (c.cost_per_lease != null && c.cost_per_lease === minCpl && chans.length > 1 ? ' best' : '') + '">' + (c.cost_per_lease != null ? esc(money(c.cost_per_lease)) : '<span aria-label="not available">—</span>') + '</td>' +
        '<td class="pt">' + esc(c.pointed_at || '') + '</td><td class="st">' + status + '</td></tr>';
    }).join('');
    return '<div class="page plan"><div class="head"><div class="stack"><h1 class="h1">Plan &amp; Spend</h1>' + (sub.length ? '<p class="lede">' + esc(sub.join(' ')) + '</p>' : '') + '</div></div>' +
      (segs ? '<section class="mix"><h2 class="eyebrow dark">Where the money is, and what it’s pointed at</h2><div class="mixbar" role="img" aria-label="Share of monthly spend by channel; the table below has the numbers">' + segs + '</div></section>' : '') +
      (rows ? '<div class="tscroll"><table class="ctable"><thead><tr><th scope="col">Channel</th><th scope="col" class="num">Monthly</th><th scope="col" class="num">Cost / lease</th><th scope="col" class="pt">Pointed at</th><th scope="col" class="st">Status</th></tr></thead><tbody>' + rows + '</tbody></table></div>' : '') +
      (has(d.caveat) ? '<div class="caveat">' + ICON.info + '<p>' + esc(d.caveat) + '</p></div>' : '') + gapsLine(d.gaps) + '</div>';
  }
  function shortChannel(name) {
    var s = String(name || '');
    if (/^performance max/i.test(s)) return 'PMax';
    return s.split(' — ')[0];
  }

  /* ── Ask ─────────────────────────────────────────────────────────── */
  function screenAsk() {
    guard(api('/api/ask/questions'), 'questions').then(function (r) {
      if (!r) return;
      var qs = ((r.data || {}).questions || []).slice().sort(function (a, b) { return (a.order || 0) - (b.order || 0); });
      setMain('<div class="page ask"><div class="head"><div class="stack"><h1 class="h1">Ask</h1><p class="lede">Every number below is computed before the answer is written. Nothing is estimated.</p></div></div>' +
        (qs.length ? '<div class="qlist" role="group" aria-label="Questions you can ask">' + qs.map(function (q) {
          return '<button type="button" class="qbtn" data-q="' + esc(q.key) + '"><b>' + esc(q.label) + '</b>' + (has(q.blurb) ? '<span>' + esc(q.blurb) + '</span>' : '') + '</button>';
        }).join('') + '</div>' : '<p class="caption">No questions are available yet.</p>') +
        '<div class="answers" aria-live="polite"></div>' +
        '<p class="note13 faint">A question with no data behind it gets a refusal, never a guess.</p></div>');
      main.querySelectorAll('[data-q]').forEach(function (b) {
        b.addEventListener('click', function () {
          var q = qs.filter(function (x) { return x.key === b.getAttribute('data-q'); })[0];
          askOne(q);
        });
      });
    });
  }

  function askOne(q) {
    var wrap = main.querySelector('.answers');
    var block = document.createElement('section');
    block.className = 'qa';
    var me = state.me || {};
    block.innerHTML = '<div class="qbubble"><span class="av sm" aria-hidden="true">' + esc(initials(me.email)) + '</span><b>' + esc(q.label) + '</b></div>' +
      '<div class="abody">' + loadingHtml('the answer').replace('class="state"', 'class="state inline"') + '</div>';
    wrap.insertBefore(block, wrap.firstChild);
    var body = block.querySelector('.abody');
    var tries = 0;
    function go() {
      api('/api/ask/' + encodeURIComponent(q.key), { method: 'POST', body: { company_id: state.companyId } }).then(function (r) {
        if (r.status === 202 && tries++ < 20) { setTimeout(go, 3000); return; }
        body.innerHTML = answerHtml(r.data || {});
      }).catch(function (err) {
        if (err && err.status === 401) return;
        body.innerHTML = '<p class="inline-err" role="alert">We couldn’t answer that just now: ' + esc(err && err.message || 'try again') + '.</p>';
      });
    }
    go();
  }

  function answerHtml(a) {
    if (a.answered === false) {
      return '<div class="refusal">' + ICON.refuse + '<p>' + esc(a.headline || a.summary || 'We can’t answer that from what we read.') + '</p></div>' + askGaps(a);
    }
    var receipts = [], idx = {};
    function ref(ev) {
      if (!(ev in idx)) { receipts.push(ev); idx[ev] = receipts.length; }
      return idx[ev];
    }
    var findings = (a.findings || []).map(function (f) {
      var refs = (f.evidence || []).map(ref);
      return '<li><b>' + esc(f.title) + '</b><p>' + esc(f.detail) + (refs.length ? ' <sup>' + refs.map(function (n) { return '<a href="#" data-ref="' + n + '" aria-label="receipt ' + n + '">' + n + '</a>'; }).join(',') + '</sup>' : '') + '</p></li>';
    }).join('');
    if (!receipts.length) (a.evidence || []).forEach(ref);
    var rc = receipts.map(function (ev, i) {
      var m = /^(.*?)\s*\[([^\]]+)\]\s*$/.exec(ev);
      return '<li id="rc-' + (i + 1) + '"><span class="n">' + (i + 1) + '</span><span>' + esc(m ? m[1] : ev) + (m ? ' <span class="src">· ' + esc(m[2]) + '</span>' : '') + '</span></li>';
    }).join('');
    return '<div class="answer"><div class="acol">' +
      (has(a.headline) ? '<p class="headline">' + esc(a.headline) + '</p>' : '') +
      (has(a.summary) ? '<p class="summary">' + esc(a.summary) + '</p>' : '') +
      (findings ? '<ol class="findings">' + findings + '</ol>' : '') +
      (has(a.next_step) ? '<p class="next"><b>Next step</b> ' + esc(a.next_step) + '</p>' : '') +
      (has(a.caveats) ? '<p class="caption">' + esc(a.caveats.join(' ')) + '</p>' : '') + askGaps(a) + '</div>' +
      (rc ? '<aside class="receipts" aria-label="The receipts"><h3 class="eyebrow">The receipts</h3><ol>' + rc + '</ol>' +
        (a.generated_at ? '<p class="receipt">Computed ' + esc(asOf(new Date(a.generated_at * 1000).toISOString())) + (a.cached ? ' · saved answer' : '') + '</p>' : '') + '</aside>' : '') + '</div>';
  }
  function askGaps(a) {
    if (!has(a.missing_inputs)) return '';
    var names = a.missing_inputs.map(function (m) { return m.source || m.input; }).filter(Boolean);
    return names.length ? '<p class="gaps">Not in this answer: ' + esc(names.join(', ')) + '.</p>' : '';
  }
  main.addEventListener('click', function (e) {
    var r = e.target.closest('[data-ref]'); if (!r) return;
    e.preventDefault();
    var box = r.closest('.answer'), li = box && box.querySelector('#rc-' + r.getAttribute('data-ref'));
    if (li) { li.classList.add('flash'); li.scrollIntoView({ block: 'nearest' }); setTimeout(function () { li.classList.remove('flash'); }, 1200); }
  });

  /* ── Client view ─────────────────────────────────────────────────── */
  var CV_STATUS = { in_production: ['In production', 'grey'], scheduled: ['Scheduled', 'grey'], complete: ['Complete', 'green'], live: ['Live', 'green'] };
  function screenClient() {
    guard(api('/api/workspace/client-view?' + cq()), 'the client view').then(function (r) {
      if (!r) return;
      setMain(clientHtml(r.data || {}));
    });
  }
  function cvRows(list, live) {
    return list.map(function (x) {
      var st = CV_STATUS[x.status] || [String(x.status || '').replace(/_/g, ' '), 'grey'];
      return '<li class="cv"><div class="cvd"><b>' + esc(mdy(x.date)) + '</b>' + (live ? '<span>live</span>' : '') + '</div>' +
        '<div class="cvb"><b>' + esc(x.title) + '</b>' + (has(x.note) ? '<p>' + esc(x.note) + '</p>' : '') + '</div>' +
        '<div class="cvs">' + (st[0] ? '<span class="pill ' + st[1] + '">' + esc(st[0]) + '</span>' : '') + '</div></li>';
    }).join('');
  }
  function clientHtml(d) {
    var c = company() || {};
    return '<div class="page client"><div class="cvhead"><div class="row9"><span class="eyebrow sage">Client view</span><span class="dotsep" aria-hidden="true">·</span><span class="receipt">what the client sees for this property</span></div>' +
      '<h1 class="h1 lg">What we’re doing at ' + esc(c.name || 'this property') + '</h1>' +
      '<p class="cvlede">Committed work and completed work. The messy middle stays on our side.</p></div>' +
      (has(d.changing) ? '<section class="cvsec"><h2 class="eyebrow">Changing</h2><ol>' + cvRows(d.changing, true) + '</ol></section>' : '') +
      (has(d.done_this_quarter) ? '<section class="cvsec"><div class="row10"><h2 class="eyebrow">Done this quarter</h2>' + (d.done_count != null ? '<span class="receipt">' + esc(num(d.done_count)) + ' ' + plural(d.done_count, 'item') + '</span>' : '') + '</div><ol>' + cvRows(d.done_this_quarter, false) + '</ol></section>' : '') +
      (!has(d.changing) && !has(d.done_this_quarter) ? '<p class="lede">Nothing committed or completed yet this quarter.</p>' : '') +
      (d.hidden_open_count ? '<div class="hiddenbox">' + ICON.lockGrey + '<p>' + esc(word(d.hidden_open_count)) + ' ' + plural(d.hidden_open_count, 'item is', 'items are') + ' open on our side and not shown here. They appear the moment they’re committed.</p></div>' : '') + '</div>';
  }

  /* ── Signals (internal) ──────────────────────────────────────────── */
  var SIGNAL_KIND = { occupancy_drop: 'Occupancy', stale_inventory: 'Stale inventory', lease_wave: 'Lease wave',
    lead_drop: 'Leads', spend_pacing: 'Spend pacing', reputation_drop: 'Reputation', tracking_break: 'Tracking',
    data_stale: 'Data freshness' };
  var SEVERITY = [['high', 'High', 'late'], ['medium', 'Medium', 'week'], ['low', 'Low', 'later']];

  function screenSignals() {
    var scoped = state.signalScope === 'property' && state.companyId;
    guard(api('/api/workspace/signals' + (scoped ? '?' + cq() : '')), 'signals').then(function (r) {
      if (!r) return;
      var d = r.data || {};
      if (!scoped && d.counts) { state.signalsHigh = d.counts.high || null; renderSide('signals'); }
      setMain(signalsHtml(d, scoped));
      bindSignals();
    });
  }

  function changeFigure(s) {
    var c = s.change || {};
    if (c.from == null || c.to == null) return '';
    var ratio = Math.abs(c.from) <= 1 && Math.abs(c.to) <= 1 && (c.from % 1 !== 0 || c.to % 1 !== 0);
    function f(v) {
      if (ratio) return (v * 100).toFixed(1).replace(/\.0$/, '') + '%';
      if (s.kind === 'spend_pacing') return money(v);
      return num(v);
    }
    return f(c.from) + ' → ' + f(c.to);
  }

  function signalRow(s) {
    var fig = changeFigure(s), win = s.change && s.change.window_days;
    var act = s.work_item_id
      ? '<a class="btn" href="#/item/' + encodeURIComponent(s.work_item_id) + '" data-open-company="' + esc(s.company_id) + '">Open work item</a>'
      : '<button type="button" class="btn primary" data-start="' + esc(s.id) + '" data-company="' + esc(s.company_id) + '">Start work</button>';
    return '<li class="srow sev-' + esc(s.severity) + '">' +
      '<div class="sc prop"><b>' + esc(s.property_name) + '</b><span>' + esc(SIGNAL_KIND[s.kind] || s.kind) + '</span></div>' +
      '<div class="sc what"><span class="t">' + esc(s.title) + '</span>' + (has(s.detail) ? '<span class="dtl">' + esc(s.detail) + '</span>' : '') +
      (receipt(s.metric) ? '<span class="receipt">' + receipt(s.metric) + '</span>' : '') + '</div>' +
      '<div class="sc chg">' + (fig ? '<b>' + esc(fig) + '</b>' + (win ? '<span>over ' + esc(win) + ' ' + plural(win, 'day') + '</span>' : '') : '') + '</div>' +
      '<div class="sc when"><span class="m-lbl">Detected </span>' + esc(asOf(s.detected_at)) + '</div>' +
      '<div class="sc act">' + act + '</div><p class="inline-err" role="alert" hidden></p></li>';
  }

  function signalsHtml(d, scoped) {
    var list = d.signals || [], counts = d.counts || {};
    var total = (counts.high || 0) + (counts.medium || 0) + (counts.low || 0);
    var c = company();
    var chips = '<button type="button" class="chip" aria-pressed="' + !scoped + '" data-sscope="all">All properties</button>' +
      (c ? '<button type="button" class="chip" aria-pressed="' + !!scoped + '" data-sscope="property">' + esc(c.name) + '</button>' : '');
    var groups = SEVERITY.map(function (sv) {
      var rows = list.filter(function (s) { return s.severity === sv[0]; });
      if (!rows.length) return '';
      return '<section class="sgroup">' + grp(sv[1] + ' · ' + rows.length, sv[2]) + '<ol class="srows">' + rows.map(signalRow).join('') + '</ol></section>';
    }).join('');
    return '<div class="page signals"><div class="head"><div class="stack"><h1 class="h1">Signals</h1>' +
      '<p class="lede">' + esc(total ? word(total) + ' ' + plural(total, 'change') + ' that ' + (total === 1 ? 'hasn’t' : 'haven’t') + ' become work yet.' : 'Nothing has changed that isn’t already work.') + '</p></div>' +
      '<div class="chips" role="group" aria-label="Which properties">' + chips + '</div></div>' +
      (groups ? '<div class="shead" aria-hidden="true"><span class="sc prop">Property</span><span class="sc what">What changed</span><span class="sc chg">Change</span><span class="sc when">Detected</span><span class="sc act"></span></div>' + groups : '') +
      '<div class="pnote"><p>Signals come from fixed rules over the data we already read. Nothing here is estimated.</p>' + gapsLine(d.gaps) + '</div></div>';
  }

  function bindSignals() {
    main.querySelectorAll('[data-sscope]').forEach(function (b) {
      b.addEventListener('click', function () { state.signalScope = b.getAttribute('data-sscope'); screenSignals(); });
    });
    main.querySelectorAll('[data-open-company]').forEach(function (a) {
      a.addEventListener('click', function () { setCompany(a.getAttribute('data-open-company')); });
    });
    main.querySelectorAll('[data-start]').forEach(function (b) {
      b.addEventListener('click', function () {
        var row = b.closest('.srow'), err = row.querySelector('.inline-err'), cid = b.getAttribute('data-company');
        b.disabled = true; b.textContent = 'Starting…';
        api('/api/workspace/signals/' + encodeURIComponent(b.getAttribute('data-start')) + '/start-work', { method: 'POST', body: { company_id: cid } })
          .then(function (r) {
            var id = (r.data || {}).work_item_id;
            var cell = row.querySelector('.sc.act');
            cell.innerHTML = id ? '<a class="btn" href="#/item/' + encodeURIComponent(id) + '">Open work item</a>' : '<span class="caption">Started</span>';
            var a = cell.querySelector('a'); if (a) a.addEventListener('click', function () { setCompany(cid); });
          }).catch(function (e) {
            b.disabled = false; b.textContent = 'Start work';
            if (e && e.status === 401) return;
            err.hidden = false; err.textContent = 'That didn’t go through: ' + (e && e.message || 'try again') + '.';
          });
      });
    });
  }

  /* ── New request (artboard E) ────────────────────────────────────── */
  var CATEGORIES = ['creative', 'web', 'paid', 'seo', 'listing', 'reputation', 'other'];
  var REQ_STATUS = { done: ['Done', 'done'], in_progress: ['In progress', 'prog'], new: ['New', 'new'] };
  var WARN_ICON = '<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M7 1.9l5.5 9.6H1.5L7 1.9z" fill="none" stroke="#AB784A" stroke-width="1.3" stroke-linejoin="round"/><path d="M7 5.9v2.4M7 9.9v.1" fill="none" stroke="#AB784A" stroke-width="1.4" stroke-linecap="round"/></svg>';

  function screenRequest() {
    var st = state.req;
    if (!st || st.companyId !== state.companyId) st = state.req = { companyId: state.companyId, text: '', tickets: [], gaps: [], sent: null };
    renderRequest();
  }
  function renderRequest(focusSel) {
    setMain(requestHtml(state.req));
    bindRequest();
    loadRecent();
    if (focusSel) { var f = main.querySelector(focusSel); if (f) f.focus(); }
  }

  function shortDay(s) {
    var n = daysFromToday(s); if (n == null) return '';
    if (n === 0) return 'today';
    if (n < 0 && n > -7) return DOW[parseDay(s).getDay()];
    return mdy(s);
  }

  function loadRecent() {
    var box = main.querySelector('[data-recent]'); if (!box) return;
    api('/api/workspace/requests?' + cq()).then(function (r) {
      var list = (r.data || {}).recent || [];
      box.innerHTML = list.length ? list.map(function (x) {
        var st = REQ_STATUS[x.status] || [String(x.status || ''), 'new'];
        var label = st[0] + (x.status === 'done' && x.status_date ? ' ' + shortDay(x.status_date) : '');
        var title = x.work_item_id ? '<a href="#/item/' + encodeURIComponent(x.work_item_id) + '">' + esc(x.title) + '</a>' : esc(x.title);
        return '<li><span class="rt">' + title + '</span><span class="rs"><i class="' + st[1] + '" aria-hidden="true"></i>' + esc(label) + '</span></li>';
      }).join('') : '<li class="caption">Nothing sent yet.</li>';
    }).catch(function (e) {
      if (e && e.status === 401) return;
      box.innerHTML = '<li class="caption">Your recent requests didn’t load.</li>';
    });
  }

  function ticketCard(t) {
    var id = esc(t.draft_id);
    var opts = CATEGORIES.map(function (c) { return '<option value="' + c + '"' + (c === t.category ? ' selected' : '') + '>' + c.toUpperCase() + '</option>'; }).join('');
    return '<article class="tcard" data-ticket="' + id + '">' +
      '<div class="ttop"><label class="sr-only" for="tt-' + id + '">Ticket title</label><input class="ttitle" id="tt-' + id + '" data-f="title" value="' + esc(t.title) + '">' +
      '<label class="sr-only" for="tc-' + id + '">Category</label><select class="tcat" id="tc-' + id + '" data-f="category">' + opts + '</select></div>' +
      '<dl class="tfields">' +
      '<div><dt>Needed by</dt><dd class="need"><input type="date" data-f="needed_by" value="' + esc(t.needed_by || '') + '" aria-label="Needed by">' +
        (has(t.needed_by_reason) ? '<span>— ' + esc(t.needed_by_reason) + '</span>' : '') + '</dd></div>' +
      (has(t.team) ? '<div><dt>Goes to</dt><dd>' + esc(t.team) + '</dd></div>' : '') +
      (has(t.attached_context) ? '<div><dt>Attached</dt><dd>' + esc(t.attached_context.join(', ')) + '</dd></div>' : '') + '</dl>' +
      (t.failed ? '<p class="inline-err">Didn’t file: ' + esc(t.failed) + '</p>' : '') +
      (t.warnings || []).map(function (w) { return '<div class="twarn">' + WARN_ICON + '<p>' + esc(w) + '</p></div>'; }).join('') +
      '<div class="tact"><button type="button" class="link quiet" data-remove="' + id + '">Remove</button></div></article>';
  }

  function sentHtml(sent) {
    var byId = {};
    (sent.tickets || []).forEach(function (t) { byId[t.draft_id] = t; });
    return (sent.created || []).map(function (c) {
      var t = byId[c.draft_id] || {};
      return '<div class="tcard"><div class="ttop"><b class="ttitle-s">' + esc(t.title || 'Request') + '</b><span class="pill green caps">FILED</span></div>' +
        (c.work_item_id ? '<a class="link" href="#/item/' + encodeURIComponent(c.work_item_id) + '">Follow it in Work</a>' : '') + '</div>';
    }).join('');
  }

  function requestHtml(st) {
    var n = st.tickets.length, teams = [];
    st.tickets.forEach(function (t) { if (t.team && teams.indexOf(t.team) === -1) teams.push(t.team); });
    var routeNote = teams.length ? 'Goes to ' + teams.join(' and ') + ', not to your AM’s inbox' : 'Goes to the team that does the work, not to your AM’s inbox';
    var action = !n ? '<button type="button" class="btn primary send" data-draft>Draft it</button>'
      : (canDecide() ? '<button type="button" class="btn primary send" data-send>Send it</button>' : '<p class="signin-row">' + signInLink('Sign in to send') + '</p>');
    var heard = n ? (n === 1 ? 'One request.' : word(n) + ' requests, filed separately.') + ' Fix anything that’s wrong before you send.'
      : (st.sent ? 'Sent. Status comes back under Your recent requests and in Work.' : 'Write it on the left and press Draft it. Each thing you ask for becomes its own ticket here.');
    var foot = n ? (n === 1 ? 'It lands' : (n === 2 ? 'Both land' : 'All ' + word(n, true) + ' land')) + ' in ClickUp with every field mapped. You never open it — status comes back here.' : '';
    return '<div class="page reqpage"><div class="req">' +
      '<section class="req-l" aria-labelledby="req-h"><div class="req-head"><h1 class="req-h" id="req-h">What do you need?</h1>' +
      '<p class="req-sub">Write it how you’d say it. No form, no dropdowns, no ClickUp.</p></div>' +
      '<label class="req-box"><span class="sr-only">Describe what you need</span><textarea data-req-text rows="6" placeholder="For example: the A1 photos are from before the renovation. Can we reshoot before the October wave?">' + esc(st.text) + '</textarea></label>' +
      '<div class="req-row">' + (n ? '<button type="button" class="link" data-draft>Draft again</button>' : '') + '<span class="grow"></span><span class="caption">' + esc(routeNote) + '</span></div>' +
      '<p class="inline-err req-err" role="alert" hidden data-req-err></p>' +
      '<section class="req-recent"><h2 class="eyebrow">Your recent requests</h2><ul class="recent" data-recent><li class="caption">Loading…</li></ul></section>' +
      action + '</section>' +
      '<section class="req-r" aria-labelledby="heard-h"><div class="req-head2"><h2 class="eyebrow" id="heard-h" tabindex="-1">What we heard</h2><p class="req-sub">' + esc(heard) + '</p></div>' +
      (st.sent ? sentHtml(st.sent) : '') + st.tickets.map(ticketCard).join('') + gapsLine(st.gaps) +
      '<div class="spacer"></div>' + (foot ? '<p class="req-foot">' + esc(foot) + '</p>' : '') + '</section></div></div>';
  }

  function readTickets() {
    var st = state.req; if (!st) return;
    main.querySelectorAll('.tcard[data-ticket]').forEach(function (card) {
      var t = st.tickets.filter(function (x) { return String(x.draft_id) === card.getAttribute('data-ticket'); })[0];
      if (!t) return;
      card.querySelectorAll('[data-f]').forEach(function (el) { t[el.getAttribute('data-f')] = el.value || null; });
    });
  }

  function bindRequest() {
    var st = state.req, ta = main.querySelector('[data-req-text]'), err = main.querySelector('[data-req-err]');
    function fail(e, what) {
      if (e && e.status === 401) return;
      err.hidden = false; err.textContent = what + ': ' + (e && e.message || 'try again') + '.';
    }
    ta.addEventListener('input', function () { st.text = ta.value; });
    main.querySelectorAll('.tcard [data-f]').forEach(function (el) { el.addEventListener('input', readTickets); el.addEventListener('change', readTickets); });
    main.querySelectorAll('[data-remove]').forEach(function (b) {
      b.addEventListener('click', function () {
        readTickets();
        var id = b.getAttribute('data-remove');
        st.tickets = st.tickets.filter(function (t) { return String(t.draft_id) !== id; });
        renderRequest('#heard-h');
      });
    });
    main.querySelectorAll('[data-draft]').forEach(function (b) {
      b.addEventListener('click', function () {
        if (!st.text.trim()) { err.hidden = false; err.textContent = 'Write what you need first.'; ta.focus(); return; }
        var label = b.textContent;
        b.disabled = true; b.textContent = 'Reading…';
        api('/api/workspace/requests/draft', { method: 'POST', body: { company_id: state.companyId, text: st.text } }).then(function (r) {
          var d = r.data || {};
          st.tickets = d.tickets || []; st.gaps = d.gaps || []; st.sent = null;
          renderRequest('#heard-h');
        }).catch(function (e) { b.disabled = false; b.textContent = label; fail(e, 'We couldn’t draft that'); });
      });
    });
    var send = main.querySelector('[data-send]');
    if (send) send.addEventListener('click', function () {
      readTickets();
      if (st.tickets.some(function (t) { return !String(t.title || '').trim(); })) { err.hidden = false; err.textContent = 'Every ticket needs a title.'; return; }
      send.disabled = true; send.textContent = 'Sending…';
      var outgoing = st.tickets.map(function (t) { var c = {}; for (var k in t) if (k !== 'failed') c[k] = t[k]; return c; });
      api('/api/workspace/requests', { method: 'POST', body: { company_id: state.companyId, tickets: outgoing } }).then(function (r) {
        var d = r.data || {}, failed = {};
        (d.failed || []).forEach(function (f) { failed[f.draft_id] = f.reason || 'not filed'; });
        st.sent = { created: d.created || [], tickets: outgoing };
        st.tickets = outgoing.filter(function (t) { return failed[t.draft_id]; }).map(function (t) { t.failed = failed[t.draft_id]; return t; });
        if (!st.tickets.length) st.text = '';
        renderRequest('#heard-h');
      }).catch(function (e) { send.disabled = false; send.textContent = 'Send it'; fail(e, 'That didn’t send'); });
    });
  }

  /* ── Reports (on hold) ───────────────────────────────────────────── */
  function screenReports() {
    setMain('<div class="page"><div class="head"><div class="stack"><h1 class="h1">Reports</h1><p class="lede">Monthly reports are being reworked. They will be back here soon.</p></div></div></div>');
  }


  /* ── Router ──────────────────────────────────────────────────────── */
  function route() {
    stopTimer();
    var h = (location.hash || '').replace(/^#\/?/, '');
    var parts = h.split('?')[0].split('/');
    var name = parts[0] || (isInternal() ? 'portfolio' : 'work');
    if ((name === 'portfolio' || name === 'signals') && !isInternal()) name = 'work';
    if (!state.companyId && name !== 'portfolio' && name !== 'signals' && name !== 'reports') {
      setMain('<div class="state"><h2>No property selected</h2><p>There are no properties on this account yet.</p></div>');
      renderSide(name); return;
    }
    var screens = {
      portfolio: screenPortfolio, work: screenWork, item: screenItem, approved: screenApproved,
      property: screenProperty, performance: screenPerformance, plan: screenPlan, ask: screenAsk,
      client: screenClient, reports: screenReports, signals: screenSignals, request: screenRequest
    };
    var fn = screens[name] || screenWork;
    renderSide(fn === screenItem || fn === screenApproved || fn === screenRequest ? 'item' : name);
    window.scrollTo(0, 0);
    fn(decodeURIComponent(parts[1] || ''));
  }

  function boot() {
    if (useClerk) loadClerk();
    setMain(loadingHtml('your workspace'));
    api('/api/workspace/me').then(function (r) {
      state.me = r.data || {};
      var list = state.me.companies || [];
      var saved = null;
      try { saved = localStorage.getItem(COMPANY_KEY); } catch (e) {}
      var ok = list.some(function (x) { return String(x.company_id) === String(saved); });
      state.companyId = ok ? saved : (list[0] ? String(list[0].company_id) : null);
      window.addEventListener('hashchange', route);
      route();
    }).catch(function (err) {
      if (err && err.status === 401) return;
      setMain(errorHtml(err));
      main.querySelector('[data-retry]').addEventListener('click', function () { window.location.reload(); });
    });
  }
  boot();
})();
</script>
</body>
</html>
